/**
 * 今日稱號：全部由今天的歷史紀錄與累計等待推算，刪除紀錄或開新球局會自動更新。
 * 每個稱號都有最低門檻，資料太少時不顯示，避免出現「1 場就連勝王」這種結果。
 */
function topBy(map, minValue) {
  const entries = Object.entries(map).filter(([, v]) => v >= minValue);
  if (!entries.length) return null;
  const best = Math.max(...entries.map(([, v]) => v));
  return { names: entries.filter(([, v]) => v === best).map(([k]) => k), value: best };
}

function todayTitles() {
  const chrono = state.history.slice().reverse();   // 由舊到新
  const recorded = chrono.filter((h) => h.winners);
  const titles = [];
  // 同分並列的多位得主以陣列保存：卡片只列第一位，點開再顯示全部
  const joinNames = (names) => names.slice();
  const add = (icon, title, who, detail) => titles.push({ icon, title, who, detail });

  // 🌟 開門紅：贏下今天第一場有記勝負的比賽
  if (recorded.length) {
    const first = recorded[0];
    add('🌟', '開門紅', first.winners.join('、'), `贏下今天第一場（#${displayNo(first)}）`);
  }

  // 🔥 連勝王 / 🌍 非洲酋長 / 🧯 連勝終結者：沒記勝負的場次不中斷連勝或連敗
  const winRun = {};
  const loseRun = {};
  const bestWin = {};
  const bestLose = {};
  const ended = {};       // 終結者 → 終結次數
  const endedBest = {};   // 終結者 → 終結過最長的連勝 {victim, length}
  recorded.forEach((h) => {
    const players = h.teamA.concat(h.teamB);
    const winners = players.filter((n) => h.winners.includes(n));
    const losers = players.filter((n) => !h.winners.includes(n));
    // 先判斷這場有沒有打斷別人 3 連勝以上
    losers.forEach((victim) => {
      const length = winRun[victim] || 0;
      if (length < 3) return;
      winners.forEach((w) => {
        ended[w] = (ended[w] || 0) + 1;
        if (!endedBest[w] || length > endedBest[w].length) endedBest[w] = { victim, length };
      });
    });
    winners.forEach((n) => {
      winRun[n] = (winRun[n] || 0) + 1;
      loseRun[n] = 0;
      bestWin[n] = Math.max(bestWin[n] || 0, winRun[n]);
    });
    losers.forEach((n) => {
      loseRun[n] = (loseRun[n] || 0) + 1;
      winRun[n] = 0;
      bestLose[n] = Math.max(bestLose[n] || 0, loseRun[n]);
    });
  });
  // 勝敗計數（不敗金身、勝率王使用）
  const winCount = {};
  const lossCount = {};
  recorded.forEach((h) => h.teamA.concat(h.teamB).forEach((n) => {
    if (h.winners.includes(n)) winCount[n] = (winCount[n] || 0) + 1;
    else lossCount[n] = (lossCount[n] || 0) + 1;
  }));

  const streak = topBy(bestWin, 3);
  if (streak) add('🔥', '連勝王', joinNames(streak.names), `最長連勝 ${streak.value} 場`);

  // 🛡️ 不敗金身：至少 3 場有記勝負，一場都沒輸
  const unbeaten = Object.keys(winCount).filter((n) => winCount[n] >= 3 && !lossCount[n]);
  if (unbeaten.length) {
    const best = Math.max(...unbeaten.map((n) => winCount[n]));
    add('🛡️', '不敗金身', joinNames(unbeaten.filter((n) => winCount[n] === best)), `${best} 戰全勝，還沒輸過`);
  }

  // 🚀 帶飛王：和最多不同搭檔一起贏過（雙打）
  const carry = {};
  recorded.forEach((h) => {
    if (h.teamA.length < 2) return;
    const team = h.teamA.every((n) => h.winners.includes(n)) ? h.teamA : h.teamB;
    team.forEach((n) => {
      carry[n] = carry[n] || new Set();
      team.filter((m) => m !== n).forEach((m) => carry[n].add(m));
    });
  });
  const carryBest = topBy(Object.fromEntries(Object.entries(carry).map(([k, v]) => [k, v.size])), 3);
  if (carryBest) add('🚀', '帶飛王', joinNames(carryBest.names), `和 ${carryBest.value} 位不同搭檔贏過`);

  // 🤝 最佳拍檔：同隊至少 2 場、勝率最高的搭檔（同勝率比勝場）
  const duo = {};
  recorded.forEach((h) => {
    if (h.teamA.length < 2) return;
    [h.teamA, h.teamB].forEach((team) => {
      const key = team.slice().sort().join('、');
      const row = duo[key] || (duo[key] = { wins: 0, games: 0 });
      row.games += 1;
      if (team.every((n) => h.winners.includes(n))) row.wins += 1;
    });
  });
  const duoBest = Object.entries(duo)
    .filter(([, r]) => r.games >= 2 && r.wins > 0)
    .sort(([, a], [, b]) => b.wins / b.games - a.wins / a.games || b.wins - a.wins)[0];
  if (duoBest) add('🤝', '最佳拍檔', duoBest[0], `${duoBest[1].games} 戰 ${duoBest[1].wins} 勝`);

  // ⚔️ 宿敵：交手（對面）次數最多的兩人
  const rival = {};
  chrono.forEach((h) => h.teamA.forEach((a) => h.teamB.forEach((b) => {
    const key = [a, b].sort().join(' vs ');
    rival[key] = (rival[key] || 0) + 1;
  })));
  const rivalBest = topBy(rival, 3);
  if (rivalBest) {
    // 兩人在對面時的勝負（只計有記勝負的場次），贏比較多的人放前面
    const [p1, p2] = rivalBest.names[0].split(' vs ');
    let w1 = 0;
    let w2 = 0;
    recorded.forEach((h) => {
      const aSide = h.teamA.includes(p1) ? 'A' : (h.teamB.includes(p1) ? 'B' : null);
      const bSide = h.teamA.includes(p2) ? 'A' : (h.teamB.includes(p2) ? 'B' : null);
      if (!aSide || !bSide || aSide === bSide) return;
      if (h.winners.includes(p1)) w1 += 1;
      else w2 += 1;
    });
    const [lead, other, lw, ll] = w1 >= w2 ? [p1, p2, w1, w2] : [p2, p1, w2, w1];
    // 交手次數包含沒記勝負的場次，標示出來避免「交手 9 次卻只有 3 勝 3 敗」的疑惑
    const unrecorded = rivalBest.value - (lw + ll);
    let detail = `交手 ${rivalBest.value} 次${unrecorded > 0 ? `（${unrecorded} 場未記勝負）` : ''}`;
    if (lw + ll > 0) {
      detail += lw === ll
        ? `，${lw} 勝 ${ll} 敗平分秋色`
        : `，${escapeHtml(lead)} 勝率 ${Math.round((lw / (lw + ll)) * 100)}%（${lw} 勝 ${ll} 敗）`;
    }
    add('⚔️', '宿敵', `${lead} vs ${other}`, detail);
  }

  // 💞 相愛相殺：同一對人當過搭檔、也當過對手，各至少 2 次
  const partnerTimes = {};
  chrono.forEach((h) => [h.teamA, h.teamB].forEach((team) => withinPairs(team).forEach(([a, b]) => {
    const key = [a, b].sort().join(' vs ');
    partnerTimes[key] = (partnerTimes[key] || 0) + 1;
  })));
  let frenemy = null;
  Object.keys(partnerTimes).forEach((key) => {
    const together = partnerTimes[key];
    const against = rival[key] || 0;
    if (together < 2 || against < 2) return;
    const score = Math.min(together, against) * 100 + together + against;
    if (!frenemy || score > frenemy.score) frenemy = { key, together, against, score };
  });
  if (frenemy) {
    add('💞', '相愛相殺', frenemy.key.replace(' vs ', '、'), `搭檔 ${frenemy.together} 次、對打 ${frenemy.against} 次`);
  }

  // 對戰紀錄：beat[X][Y] = X 在對面贏 Y 的次數；同時計算復仇
  const beat = {};
  const debt = {};      // debt[X][Y] = X 輸給 Y 還沒討回的次數
  const revenge = {};
  const revengeOn = {};
  const bump = (map, a, b) => { map[a] = map[a] || {}; map[a][b] = (map[a][b] || 0) + 1; };
  recorded.forEach((h) => {
    const players = h.teamA.concat(h.teamB);
    const winners = players.filter((n) => h.winners.includes(n));
    const losers = players.filter((n) => !h.winners.includes(n));
    winners.forEach((w) => losers.forEach((l) => {
      bump(beat, w, l);
      if (debt[w] && debt[w][l] > 0) {   // 之前輸給 l，這場討回來
        debt[w][l] -= 1;
        revenge[w] = (revenge[w] || 0) + 1;
        revengeOn[w] = l;
      }
      bump(debt, l, w);
    }));
  });
  const wins = (a, b) => (beat[a] && beat[a][b]) || 0;

  // 🎯 剋星：對同一位對手至少 3 戰全勝
  let nemesis = null;
  Object.keys(beat).forEach((a) => Object.keys(beat[a]).forEach((b) => {
    const w = wins(a, b);
    if (w >= 3 && wins(b, a) === 0 && (!nemesis || w > nemesis.w)) nemesis = { a, b, w };
  }));
  if (nemesis) add('🎯', '剋星', nemesis.a, `對 ${escapeHtml(nemesis.b)} ${nemesis.w} 戰全勝`);

  // 😵 苦主：輸給同一位對手最多次，至少 3 次
  let victim = null;
  Object.keys(beat).forEach((a) => Object.keys(beat[a]).forEach((b) => {
    const w = wins(a, b);
    if (w >= 3 && (!victim || w > victim.w)) victim = { loser: b, winner: a, w };
  }));
  if (victim) add('😵', '苦主', victim.loser, `被 ${escapeHtml(victim.winner)} 打敗 ${victim.w} 次`);

  // 🦸 復仇者：輸給某人後又贏回來最多次
  const avenger = topBy(revenge, 1);
  if (avenger) {
    const one = avenger.value === 1 && avenger.names.length === 1;
    add('🦸', '復仇者', joinNames(avenger.names),
      one ? `向 ${escapeHtml(revengeOn[avenger.names[0]])} 討回一勝` : `復仇成功 ${avenger.value} 次`);
  }

  // 🧯 連勝終結者
  const enderBest = topBy(ended, 1);
  if (enderBest) {
    const who = enderBest.names;
    const top = endedBest[who[0]];
    // 只終結過一次、且同一場一起終結的（例如雙打兩位勝方）→ 寫出被終結的人
    const sameEvent = who.every((w) => endedBest[w].victim === top.victim && endedBest[w].length === top.length);
    const detail = enderBest.value === 1 && sameEvent
      ? `終結了 ${escapeHtml(top.victim)} 的 ${top.length} 連勝`
      : `終結別人的連勝 ${enderBest.value} 次`;
    add('🧯', '連勝終結者', joinNames(who), detail);
  }

  // 每人依時間順序的勝負序列（只計有記勝負的場次）
  const results = {};
  recorded.forEach((h) => h.teamA.concat(h.teamB).forEach((n) => {
    (results[n] = results[n] || []).push(h.winners.includes(n) ? 'W' : 'L');
  }));

  // 🔄 逆轉人生：連敗至少 2 場後，緊接著連勝至少 2 場；取反彈幅度最大的
  let comeback = null;
  Object.entries(results).forEach(([name, seq]) => {
    const runs = seq.join('').match(/W+|L+/g) || [];
    for (let i = 0; i + 1 < runs.length; i += 1) {
      const lose = runs[i];
      const win = runs[i + 1];
      if (lose[0] !== 'L' || lose.length < 2 || win.length < 2) continue;
      const score = win.length * 10 + lose.length;
      if (!comeback || score > comeback.score) comeback = { name, lose: lose.length, win: win.length, score };
    }
  });
  if (comeback) add('🔄', '逆轉人生', comeback.name, `連敗 ${comeback.lose} 場後連勝 ${comeback.win} 場`);

  // 🐢 慢熱型：前兩場都輸，之後贏最多場（至少 2 場）
  const slow = {};
  Object.entries(results).forEach(([name, seq]) => {
    if (seq.length >= 4 && seq[0] === 'L' && seq[1] === 'L') {
      slow[name] = seq.slice(2).filter((r) => r === 'W').length;
    }
  });
  const slowBest = topBy(slow, 2);
  if (slowBest) add('🐢', '慢熱型', joinNames(slowBest.names), `前 2 場落敗，之後贏了 ${slowBest.value} 場`);

  // 👑 勝率王 / 🫠 我就爛：至少記錄 3 場勝負；大家勝率都一樣時不頒
  const rate = {};
  todayStats().filter((r) => r.games >= 3).forEach((r) => { rate[r.name] = Math.round((r.wins / r.games) * 100); });
  const rates = Object.values(rate);
  const spread = rates.length ? Math.max(...rates) - Math.min(...rates) : 0;
  const rateBest = topBy(rate, 1);
  if (rateBest) {
    // 同勝率時以勝場多者為準，把原本勝場王的資訊合併進來
    const maxWins = Math.max(...rateBest.names.map((n) => winCount[n] || 0));
    const kings = rateBest.names.filter((n) => (winCount[n] || 0) === maxWins);
    const losses = lossCount[kings[0]] || 0;
    add('👑', '勝率王', joinNames(kings), `勝率 ${rateBest.value}%（${maxWins} 勝 ${losses} 敗）`);
  }

  // 體力相關稱號：依每場開打當下的體力判斷（同一人同一時間點只算一次）
  const hpMemo = new Map();
  const hpAt = (p, time) => {
    const key = `${p.id}|${time}`;
    if (!hpMemo.has(key)) hpMemo.set(key, staminaTrack(p, time).value);
    return hpMemo.get(key);
  };
  const playerByName = {};
  state.players.forEach((p) => { playerByName[p.name] = p; });
  const lowWins = {};
  const zeroWins = {};
  const favWins = {};     // 體力較滿的一隊贏
  const underWins = {};   // 體力較少的一隊贏
  const HP_GAP = 20;      // 兩隊平均體力差距至少 20 才算「滿血 vs 少血」
  recorded.forEach((h) => {
    if (!h.startedAt) return;
    // 兩隊開打時的平均體力
    const teamHp = (team) => {
      const hps = team.map((n) => playerByName[n]).filter(Boolean).map((p) => hpAt(p, h.startedAt));
      return hps.length ? hps.reduce((a, b) => a + b, 0) / hps.length : null;
    };
    const hpA = teamHp(h.teamA);
    const hpB = teamHp(h.teamB);
    if (hpA !== null && hpB !== null && Math.abs(hpA - hpB) >= HP_GAP) {
      const aWon = h.teamA.every((n) => h.winners.includes(n));
      const winnerFuller = aWon ? hpA > hpB : hpB > hpA;
      h.winners.forEach((name) => {
        const map = winnerFuller ? favWins : underWins;
        map[name] = (map[name] || 0) + 1;
      });
    }
    h.winners.forEach((name) => {
      const p = playerByName[name];
      if (!p) return;
      const hp = hpAt(p, h.startedAt);
      if (hp < 30) lowWins[name] = (lowWins[name] || 0) + 1;
      if (hp <= 0) zeroWins[name] = (zeroWins[name] || 0) + 1;
    });
  });

  // 🩸 殘血王：開打時體力低於 30，還贏最多場
  const lowBest = topBy(lowWins, 2);
  if (lowBest) add('🩸', '殘血王', joinNames(lowBest.names), `體力不到 30 還贏了 ${lowBest.value} 場`);

  // 🧟 不死喪屍：體力 0 還贏球
  const zombie = topBy(zeroWins, 1);
  if (zombie) add('🧟', '不死喪屍', joinNames(zombie.names), `體力歸零還贏了 ${zombie.value} 場`);

  // 🍀 天時地利人和：體力較滿的一隊，贏最多場
  const favBest = topBy(favWins, 2);
  if (favBest) add('🍀', '天時地利人和', joinNames(favBest.names), `體力佔優勢時贏了 ${favBest.value} 場`);

  // 🔒 鎖血戰士：體力較少的一隊，還贏最多場
  const underBest = topBy(underWins, 1);
  if (underBest) add('🔒', '鎖血戰士', joinNames(underBest.names), `體力較少還贏了 ${underBest.value} 場`);

  // 🪫 第一個沒電：今天最早把體力打到 0
  let firstOut = null;
  state.players.forEach((p) => {
    const { zeroAt } = staminaTrack(p);
    if (zeroAt !== null && (!firstOut || zeroAt < firstOut.at)) firstOut = { name: p.name, at: zeroAt };
  });
  if (firstOut) add('🪫', '第一個沒電', firstOut.name, `${formatTime(firstOut.at)} 體力歸零`);

  // 🎲 爆冷王：賽前預測不被看好（≤ 40%）卻贏球最多次
  const upsetWins = {};
  const upsetLowest = {};
  recorded.forEach((h) => {
    const { upset, winnerP } = matchPrediction(h);
    if (!upset) return;
    h.winners.forEach((n) => {
      upsetWins[n] = (upsetWins[n] || 0) + 1;
      upsetLowest[n] = Math.min(upsetLowest[n] === undefined ? 1 : upsetLowest[n], winnerP);
    });
  });
  const upsetBest = topBy(upsetWins, 1);
  if (upsetBest) {
    const low = Math.min(...upsetBest.names.map((n) => upsetLowest[n]));
    add('🎲', '爆冷王', joinNames(upsetBest.names), `爆冷贏了 ${upsetBest.value} 場，最低賽前勝率 ${Math.round(low * 100)}%`);
  }

  // 🌍 非洲酋長：最長連敗
  const losing = topBy(bestLose, 3);
  if (losing) add('🌍', '非洲酋長', joinNames(losing.names), `最長連敗 ${losing.value} 場`);

  if (spread > 0) {
    const low = Math.min(...rates);
    const names = Object.keys(rate).filter((n) => rate[n] === low);
    add('🫠', '我就爛', joinNames(names), `勝率 ${low}%`);
  }
  return titles;
}

/**
 * 搭檔關係圖：球員排成一圈，搭檔過就連線，線越粗代表搭越多次。
 * 點一位球員會只亮出他的連線，再點一次取消；長按名字可開個人頁（點兩次也行）。
 */
function renderNetwork() {
  const pairs = {};
  const names = new Set();
  state.history.forEach((h) => [h.teamA, h.teamB].forEach((team) => {
    team.forEach((n) => names.add(n));
    withinPairs(team).forEach(([a, b]) => {
      const key = [a, b].sort().join('|');
      pairs[key] = (pairs[key] || 0) + 1;
    });
  }));
  const list = Array.from(names);
  if (!Object.keys(pairs).length) return '<p class="sub">打過雙打後，這裡會畫出誰和誰搭檔過。</p>';

  const size = 360;
  const c = size / 2;
  const r = size / 2 - 52;
  const pos = {};
  list.forEach((n, i) => {
    const a = (i / list.length) * Math.PI * 2 - Math.PI / 2;
    pos[n] = { x: c + r * Math.cos(a), y: c + r * Math.sin(a), a };
  });
  const max = Math.max(...Object.values(pairs));
  const focus = ui.networkFocus && names.has(ui.networkFocus) ? ui.networkFocus : null;
  const edges = Object.entries(pairs).map(([key, count]) => {
    const [a, b] = key.split('|');
    const on = focus && (a === focus || b === focus);
    const w = 1.5 + (count / max) * 7;
    return `<line class="edge ${on ? 'on' : ''}" x1="${pos[a].x.toFixed(1)}" y1="${pos[a].y.toFixed(1)}"
      x2="${pos[b].x.toFixed(1)}" y2="${pos[b].y.toFixed(1)}" stroke-width="${w.toFixed(1)}"
      stroke-opacity="${on ? 1 : (0.35 + 0.5 * count / max).toFixed(2)}"><title>${escapeHtml(a)}、${escapeHtml(b)}：${count} 次</title></line>`;
  }).join('');
  const nodes = list.map((n) => {
    const p = pos[n];
    const on = focus && (n === focus || pairs[[n, focus].sort().join('|')]);
    const lx = c + (r + 26) * Math.cos(p.a);
    const ly = c + (r + 26) * Math.sin(p.a);
    const anchor = Math.abs(Math.cos(p.a)) < 0.3 ? 'middle' : (Math.cos(p.a) > 0 ? 'start' : 'end');
    return `<g class="node ${on ? 'on' : ''}" data-action="network-focus" data-name="${escapeHtml(n)}">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="7"/>
      <circle class="hit" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="20"/>
      <text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}">${escapeHtml(n)}</text>
    </g>`;
  }).join('');

  let caption = '點球員名字，只顯示他的搭檔連線。';
  if (focus) {
    const mates = Object.entries(pairs)
      .filter(([k]) => k.split('|').includes(focus))
      .map(([k, v]) => ({ n: k.split('|').find((x) => x !== focus), v }))
      .sort((a, b) => b.v - a.v);
    caption = `<strong>${escapeHtml(focus)}</strong> 搭檔過 ${mates.length} 人：${mates.map((m) => `${escapeHtml(m.n)} ${m.v} 次`).join('、')}
      <button class="btn-ghost" data-action="player-open" data-name="${escapeHtml(focus)}">看個人頁</button>`;
  }
  return `<div class="network ${focus ? 'focus' : ''}">
    <svg viewBox="0 0 ${size} ${size}" role="img" aria-label="搭檔關係圖">${edges}${nodes}</svg>
  </div>
  <p class="sub" style="margin-top:6px">${caption}</p>`;
}

    return {
      title: `第 ${r.courtIndex + 1} 場地・選出勝方`,
      teamA: match.teamA.map((id) => ({ id, name: playerName(id) })),
      teamB: match.teamB.map((id) => ({ id, name: playerName(id) })),

  }
  const entry = state.history.find((h) => h.no === r.no);

  return {
    title: `#${displayNo(entry)}・${entry.winners ? '修改' : '補記'}勝負`,
    teamA: entry.teamAIds.map((id, i) => ({ id, name: entry.teamA[i] })),

function titleHolders(t) {
  if (Array.isArray(t.who)) return t.who;
  return String(t.who).split(/、| vs /);
}

function renderProfileModal() {
  const name = ui.profileName;
  const player = state.players.find((p) => p.name === name);
  const chrono = state.history.slice().reverse().filter((h) => h.teamA.includes(name) || h.teamB.includes(name));
  const recorded = chrono.filter((h) => h.winners);
  const wins = recorded.filter((h) => h.winners.includes(name)).length;
  const losses = recorded.length - wins;
  const rate = recorded.length ? `${Math.round((wins / recorded.length) * 100)}%` : '—';

  // 搭檔與對手
  const partners = {};
  const opponents = {};
  chrono.forEach((h) => {
    const mine = h.teamA.includes(name) ? h.teamA : h.teamB;
    const theirs = mine === h.teamA ? h.teamB : h.teamA;
    const won = h.winners ? h.winners.includes(name) : null;
    mine.filter((n) => n !== name).forEach((n) => {
      const r = partners[n] || (partners[n] = { n, games: 0, wins: 0, decided: 0 });
      r.games += 1;
      if (won !== null) { r.decided += 1; if (won) r.wins += 1; }
    });
    theirs.forEach((n) => {
      const r = opponents[n] || (opponents[n] = { n, games: 0, wins: 0, decided: 0 });
      r.games += 1;
      if (won !== null) { r.decided += 1; if (won) r.wins += 1; }
    });
  });
  const list = (rows, fmt) => (rows.length
    ? `<ul class="profile-list">${rows.map((r) => `<li><span>${escapeHtml(r.n)}</span><span>${fmt(r)}</span></li>`).join('')}</ul>`
    : '<p class="sub">還沒有資料</p>');
  const record = (r) => (r.decided ? `${r.wins} 勝 ${r.decided - r.wins} 敗` : '未記勝負');
  const topPartners = Object.values(partners).sort((a, b) => b.games - a.games || b.wins - a.wins).slice(0, 3);
  const bestPartner = Object.values(partners).filter((r) => r.decided >= 2 && r.wins * 2 > r.decided)
    .sort((a, b) => b.wins / b.decided - a.wins / a.decided || b.wins - a.wins)[0];
  const decidedOpp = Object.values(opponents).filter((r) => r.decided >= 2);
  const easiest = decidedOpp.slice().sort((a, b) => b.wins / b.decided - a.wins / a.decided || b.decided - a.decided)[0];
  const hardest = decidedOpp.slice().sort((a, b) => a.wins / a.decided - b.wins / b.decided || b.decided - a.decided)[0];

  const form = recorded.slice(-8).map((h) => (h.winners.includes(name)
    ? '<span class="w">勝</span>' : '<span class="l">敗</span>')).join('');
  const titles = todayTitles().filter((t) => titleHolders(t).includes(name));
  const hp = player ? staminaOf(player) : null;

  const relation = [
    bestPartner ? `<li><span>🤝 最合拍搭檔：${escapeHtml(bestPartner.n)}</span><span>${record(bestPartner)}</span></li>` : '',
    easiest && easiest.wins > easiest.decided - easiest.wins
      ? `<li><span>🎯 最好打的對手：${escapeHtml(easiest.n)}</span><span>${record(easiest)}</span></li>` : '',
    hardest && hardest.wins < hardest.decided - hardest.wins
      ? `<li><span>😵 最難纏的對手：${escapeHtml(hardest.n)}</span><span>${record(hardest)}</span></li>` : '',
  ].join('');

  return `
    <h3>${escapeHtml(name)}</h3>
    <p class="sub" style="margin:0">${player && !player.active ? '休息中' : (player && onCourtIds().has(player.id) ? '場上' : '等待中')}
      ${hp !== null ? `・體力 ${hp}` : ''}</p>
    <div class="profile-stats">
      <div><b class="num">${chrono.length}</b><small>完成場數</small></div>
      <div><b class="num">${wins}</b><small>勝</small></div>
      <div><b class="num">${losses}</b><small>敗</small></div>
      <div><b class="num">${rate}</b><small>勝率</small></div>
    </div>
    ${form ? `<h4 class="profile-h">最近戰況（由舊到新）</h4><div class="form-chips">${form}</div>` : ''}
    ${titles.length ? `<h4 class="profile-h">今日稱號</h4>
      <div class="chips" style="margin-bottom:12px">${titles.map((t) => `<span class="chip">${t.icon} ${t.title}</span>`).join('')}</div>` : ''}
    ${relation ? `<h4 class="profile-h">關係</h4><ul class="profile-list">${relation}</ul>` : ''}
    <h4 class="profile-h">最常搭檔</h4>
    ${list(topPartners, (r) => `${r.games} 次・${record(r)}`)}
    <button class="btn-primary btn-block" data-action="modal-close">關閉</button>`;
}

function renderModal() {
  const root = document.getElementById('modal-root');
  const previous = root.querySelector('.modal');
  const scrollTop = previous ? previous.scrollTop : 0;

  let content = '';
  if (ui.manual) content = renderManualModal();
  else if (ui.result) content = renderResultModal();
  else if (ui.backup) content = renderBackupModal();
  else if (ui.copyText) content = renderCopyModal();
  else if (ui.titleIndex !== null && ui.titleIndex !== undefined) content = renderTitleModal();
  else if (ui.report) content = renderReportModal();
  else if (ui.profileName) content = renderProfileModal();
  else if (ui.settings) content = renderSettingsModal();

  // 只有第一次開啟才播放進場動畫，之後的更新不重播
  const enterClass = previous ? '' : ' modal-enter';
  root.innerHTML = content
    ? `<div class="modal-bg" data-action="modal-close">
        <div class="modal${enterClass}" role="dialog" aria-modal="true">${content}</div></div>`
    : '';

  const current = root.querySelector('.modal');
  if (current && previous) current.scrollTop = scrollTop;
  document.body.classList.toggle('modal-open', Boolean(content));
}

function manualAutoSplit() {
  const needTotal = TEAM_SIZE[state.mode] * 2;
  const ids = Object.keys(ui.manual.sides).map(Number);
  if (ids.length !== needTotal) {
    showToast(`請先選 ${needTotal} 人（按 A 或 B 皆可）`);
    return;
  }
  const split = bestSplit(ids);
  const sides = {};
  split.teamA.forEach((id) => { sides[id] = 'A'; });
  split.teamB.forEach((id) => { sides[id] = 'B'; });
  ui.manual.sides = sides;
}

function manualConfirm() {
  const size = TEAM_SIZE[state.mode];
  const entries = Object.entries(ui.manual.sides);
  const teamA = entries.filter(([, s]) => s === 'A').map(([id]) => Number(id));
  const teamB = entries.filter(([, s]) => s === 'B').map(([id]) => Number(id));
  if (teamA.length !== size || teamB.length !== size) {
    showToast(`每隊需要 ${size} 人`);
    return false;
  }
  commitMatch(ui.manual.courtIndex, teamA, teamB, true);
  // 改為手動：只是換人，沿用原本的開局時間，不視為新開一局
  const match = state.courts[ui.manual.courtIndex].match;
  if (ui.manual.openedAt) match.openedAt = ui.manual.openedAt;
  // 計時接續：沿用原本的起點與暫停時間；換人前是暫停中，換人後仍維持暫停
  if (ui.manual.clock) {
    match.clockStart = ui.manual.clock.clockStart;
    match.carriedPausedMs = ui.manual.clock.carriedPausedMs;
    if (ui.manual.clock.wasPaused) match.pauses = [[match.startedAt, null]];
  }
  return true;
}

/* ===================== 今日戰報圖片 ===================== */
const REPORT_W = 1080;
const REPORT_PAD = 60;
const REPORT_FONT = '"PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif';
const REPORT_COLORS = {
  bg: '#E9EEE6', card: '#FFFFFF', ink: '#14261C', muted: '#5B6B61',
  court: '#2D6A4F', courtDark: '#1B4332', line: '#F7F7F2', tape: '#F2C94C', stripe: '#F3F6F1',
};

// 逐字斷行：中文沒有空格，以字元為單位，寬度超過就換行
function wrapText(ctx, text, maxWidth) {
  const lines = [];
  let line = '';
  Array.from(text).forEach((ch) => {
    if (ctx.measureText(line + ch).width > maxWidth && line) {
      lines.push(line);
      line = ch;
    } else {
      line += ch;
    }
  });
  if (line) lines.push(line);
  return lines;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function reportData() {
  const chrono = state.history.slice().reverse();
  const starts = chrono.map((h) => h.startedAt).filter(Boolean);
  const ends = chrono.map((h) => h.endedAt).filter(Boolean);
  const first = starts.length ? Math.min(...starts) : Date.now();
  const last = ends.length ? Math.max(...ends) : Date.now();
  const minutes = Math.max(0, Math.round((last - first) / 60000));

  // 每人戰績：完成場數來自全部紀錄，勝敗只計有記勝負的場次
  const rows = {};
  chrono.forEach((h) => h.teamA.concat(h.teamB).forEach((n) => {
    const r = rows[n] || (rows[n] = { name: n, games: 0, wins: 0, losses: 0 });
    r.games += 1;
    if (h.winners) {
      if (h.winners.includes(n)) r.wins += 1;
      else r.losses += 1;
    }
  }));
  const list = Object.values(rows).sort((a, b) => {
    const ra = a.wins + a.losses ? a.wins / (a.wins + a.losses) : -1;
    const rb = b.wins + b.losses ? b.wins / (b.wins + b.losses) : -1;
    return rb - ra || b.wins - a.wins || b.games - a.games;
  });

  const d = new Date(first);
  const week = '日一二三四五六'[d.getDay()];
  return {
    date: `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}（${week}）`,
    span: `${formatTime(first)}–${formatTime(last)}`,
    duration: minutes >= 60 ? `${Math.floor(minutes / 60)} 小時 ${minutes % 60} 分` : `${minutes} 分`,
    players: list.length,
    matches: chrono.length,
    titles: todayTitles(),
    rows: list,
  };
}

/**
 * 以 Canvas 繪製戰報圖：先用暫存畫布量測各區塊高度，再建立正式畫布繪製。
 * 寬 1080px，高度依稱號與人數自動延伸。
 */
function buildReportCanvas() {
  const data = reportData();
  const C = REPORT_COLORS;
  const innerW = REPORT_W - REPORT_PAD * 2;
  const gap = 24;
  const cardW = (innerW - gap) / 2;
  const font = (size, weight = 400) => `${weight} ${size}px ${REPORT_FONT}`;
  const plain = (t) => String(t).replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");

  // ---------- 量測 ----------
  const measure = document.createElement('canvas').getContext('2d');
  const cards = data.titles.map((t) => {
    measure.font = font(38, 700);
    const nameLines = wrapText(measure, Array.isArray(t.who) ? t.who.join('、') : t.who, cardW - 48);
    measure.font = font(28);
    const detailLines = wrapText(measure, plain(t.detail), cardW - 48);
    const h = 24 + 40 + 12 + nameLines.length * 50 + 6 + detailLines.length * 38 + 24;
    return { t, nameLines, detailLines, h };
  });
  const cardRows = [];
  for (let i = 0; i < cards.length; i += 2) cardRows.push(Math.max(cards[i].h, cards[i + 1] ? cards[i + 1].h : 0));
  const headerH = 250;
  const titlesH = cards.length ? 80 + cardRows.reduce((a, b) => a + b, 0) + gap * (cardRows.length - 1) : 0;
  const rowH = 64;
  const tableH = 80 + 70 + data.rows.length * rowH;
  const footerH = 110;
  const height = REPORT_PAD + headerH + 40 + titlesH + (cards.length ? 50 : 0) + tableH + footerH;

  // ---------- 繪製 ----------
  const canvas = document.createElement('canvas');
  canvas.width = REPORT_W;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, REPORT_W, height);
  ctx.textBaseline = 'top';
  let y = REPORT_PAD;

  // 標題區：球場綠底＋白色場線裝飾
  roundRect(ctx, REPORT_PAD, y, innerW, headerH, 28);
  ctx.fillStyle = C.court;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = 'rgba(247,247,242,0.18)';
  ctx.lineWidth = 4;
  [0.62, 0.8].forEach((r) => { ctx.beginPath(); ctx.moveTo(REPORT_PAD + innerW * r, y); ctx.lineTo(REPORT_PAD + innerW * r, y + headerH); ctx.stroke(); });
  ctx.beginPath(); ctx.moveTo(REPORT_PAD + innerW * 0.62, y + headerH / 2); ctx.lineTo(REPORT_PAD + innerW, y + headerH / 2); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = C.line;
  ctx.font = font(64, 800);
  ctx.fillText('🏸 今日羽球戰報', REPORT_PAD + 40, y + 40);
  ctx.font = font(34, 500);
  ctx.fillText(`${data.date}  ${data.span}`, REPORT_PAD + 40, y + 128);
  ctx.fillStyle = C.tape;
  ctx.font = font(34, 700);
  ctx.fillText(`${data.players} 人參加・共 ${data.matches} 場・打了 ${data.duration}`, REPORT_PAD + 40, y + 180);
  y += headerH + 40;

  // 今日稱號
  if (cards.length) {
    ctx.fillStyle = C.ink;
    ctx.font = font(44, 800);
    ctx.fillText('今日稱號', REPORT_PAD, y);
    y += 80;
    cards.forEach((c, i) => {
      const col = i % 2;
      const rowIndex = Math.floor(i / 2);
      if (col === 0 && rowIndex > 0) y += cardRows[rowIndex - 1] + gap;
      const x = REPORT_PAD + col * (cardW + gap);
      roundRect(ctx, x, y, cardW, cardRows[rowIndex], 22);
      ctx.fillStyle = C.card;
      ctx.fill();
      ctx.fillStyle = C.tape;
      ctx.fillRect(x, y + 16, 8, cardRows[rowIndex] - 32);
      let cy = y + 24;
      ctx.fillStyle = C.muted;
      ctx.font = font(30, 500);
      ctx.fillText(`${c.t.icon} ${c.t.title}`, x + 28, cy);
      cy += 52;
      ctx.fillStyle = C.ink;
      ctx.font = font(38, 700);
      c.nameLines.forEach((l) => { ctx.fillText(l, x + 28, cy); cy += 50; });
      cy += 6;
      ctx.fillStyle = C.muted;
      ctx.font = font(28);
      c.detailLines.forEach((l) => { ctx.fillText(l, x + 28, cy); cy += 38; });
    });
    y += cardRows[cardRows.length - 1] + 50;
  }

  // 今日戰績表
  ctx.fillStyle = C.ink;
  ctx.font = font(44, 800);
  ctx.fillText('今日戰績', REPORT_PAD, y);
  y += 80;
  const cols = [
    { label: '#', w: 80, align: 'left' },
    { label: '球員', w: 330, align: 'left' },
    { label: '場數', w: 140, align: 'right' },
    { label: '勝', w: 120, align: 'right' },
    { label: '敗', w: 120, align: 'right' },
    { label: '勝率', w: innerW - 80 - 330 - 140 - 120 - 120 - 40, align: 'right' },
  ];
  roundRect(ctx, REPORT_PAD, y, innerW, 70 + data.rows.length * rowH, 22);
  ctx.fillStyle = C.card;
  ctx.fill();
  const drawRow = (cells, rowY, opts = {}) => {
    let x = REPORT_PAD + 20;
    cells.forEach((text, k) => {
      const col = cols[k];
      ctx.textAlign = col.align;
      ctx.fillStyle = opts.color || C.ink;
      ctx.font = opts.font || font(32, k === 1 ? 600 : 400);
      ctx.fillText(text, col.align === 'right' ? x + col.w : x, rowY);
      x += col.w;
    });
    ctx.textAlign = 'left';
  };
  drawRow(cols.map((c) => c.label), y + 20, { color: C.muted, font: font(28, 600) });
  y += 70;
  data.rows.forEach((r, i) => {
    if (i % 2 === 0) {
      ctx.fillStyle = C.stripe;
      ctx.fillRect(REPORT_PAD, y, innerW, rowH);
    }
    const decided = r.wins + r.losses;
    const rate = decided ? `${Math.round((r.wins / decided) * 100)}%` : '—';
    drawRow([String(i + 1), r.name, String(r.games), decided ? String(r.wins) : '—', decided ? String(r.losses) : '—', rate], y + 14);
    y += rowH;
  });
  y += 40;

  ctx.fillStyle = C.muted;
  ctx.font = font(26);
  ctx.fillText(`勝負只計算有記錄的場次・羽球輪轉排場 v${APP_VERSION}`, REPORT_PAD, y + 10);
  return canvas;
}

function openReport() {
  if (!state.history.length) {
    showToast('今天還沒有完成的比賽');
    return;
  }
  const canvas = buildReportCanvas();
  const d = new Date();
  const fileName = `羽球戰報-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.png`;
  ui.report = { url: canvas.toDataURL('image/png'), fileName, blob: null };
  canvas.toBlob((blob) => { if (ui.report) ui.report.blob = blob; }, 'image/png');
  renderModal();
}

function renderReportModal() {
  const canShare = Boolean(navigator.share && navigator.canShare);
  return `
    <h3>今日戰報</h3>
    <p class="sub">${canShare ? '按「分享」可以直接傳到 LINE，或存到相簿。' : '長按圖片即可儲存或分享。'}</p>
    <img class="report-img" src="${ui.report.url}" alt="今日戰報">
    <div class="modal-foot">
      ${canShare ? '<button class="btn-tape" data-action="report-share">分享圖片</button>' : ''}
      <button class="btn-primary" data-action="modal-close">關閉</button>
    </div>`;
}

async function shareReport() {
  const r = ui.report;
  if (!r) return;
  try {
    const blob = r.blob || await (await fetch(r.url)).blob();
    const file = new File([blob], r.fileName, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '今日羽球戰報' });
    } else {
      showToast('這個瀏覽器不支援直接分享，請長按圖片儲存');
    }
  } catch (err) {
    if (err && err.name !== 'AbortError') showToast('分享失敗，請長按圖片儲存');   // 使用者取消分享不提示
  }
}

/* 結束今日打球：取消場上未完成的比賽（不列入紀錄），保留所有資料並產生戰報 */
function endDay() {
  state.courts.forEach((court, i) => { if (court.match) cancelMatch(i); });
  state.dayEnded = true;
}

/* ===================== 複製排場 ===================== */
function buildLineupText() {
  const lines = [`🏸 羽球排場 ${formatTime(Date.now())}`];
  state.courts.forEach((court, i) => {
    if (!court.match) {
      lines.push(`第${i + 1}場地：空場`);
      return;
    }
    const team = (ids) => ids.map(playerName).join('、');
    const status = isPaused(court.match) ? '暫停中' : `已打 ${playedMinutes(court.match)} 分`;
    lines.push(`第${i + 1}場地：${team(court.match.teamA)} vs ${team(court.match.teamB)}（${status}）`);
  });
  const needTotal = TEAM_SIZE[state.mode] * 2;
  const waiting = rankPlayersStable(availablePlayers()).map((p) => p.name);
  if (waiting.length) {
    lines.push(`⏭ 下一場（預計）：${waiting.slice(0, needTotal).join('、')}`);
    if (waiting.length > needTotal) lines.push(`⏳ 等待中：${waiting.slice(needTotal).join('、')}`);
  }
  const resting = state.players.filter((p) => !p.active).map((p) => p.name);
  if (resting.length) lines.push(`😴 休息：${resting.join('、')}`);
  return lines.join('\n');
}

function copyLineup() {
  const text = buildLineupText();
  const fallback = () => {
    ui.copyText = text;
    renderModal();
  };
  if (!navigator.clipboard || !navigator.clipboard.writeText) {
    fallback();
    return;
  }
  // 必須在點擊當下直接呼叫，iOS 才允許寫入剪貼簿
  navigator.clipboard.writeText(text).then(
    () => showToast('已複製排場，可以貼到 LINE'),
    fallback,
  );
}

/* ===================== 螢幕常亮 ===================== */
let wakeLock = null;

async function syncWakeLock() {
  if (!wakeLockSupported()) return;
  const want = state.keepAwake !== false && state.players.length > 0
    && document.visibilityState === 'visible';
  try {
    if (want && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch (err) {
    // 部分瀏覽器需要使用者操作才能啟用，或系統省電模式下拒絕；下次點擊時會再嘗試
    wakeLock = null;
  }
}

// 切回 app 時系統會自動釋放常亮，需要重新申請
document.addEventListener('visibilitychange', () => { syncWakeLock(); });

/* ===================== 比賽計時 ===================== */
// 只更新計時數字，不重畫整頁，避免影響正在操作的畫面
setInterval(() => {
  document.querySelectorAll('[data-elapsed-court]').forEach((el) => {
    const match = state.courts[Number(el.dataset.elapsedCourt)] && state.courts[Number(el.dataset.elapsedCourt)].match;
    if (match) el.textContent = playedMinutes(match);
  });
  const typing = document.activeElement && document.activeElement.matches('input, textarea, select');
  const modalOpen = document.querySelector('.modal');
  if (ui.tab === 'players' && state.players.length && !typing && !modalOpen && !drag.active) render();
}, 20000);

/* ===================== 分頁切換與滑動 ===================== */
function animateTabIndicator() {
  const bar = document.querySelector('.tab-indicator');
  if (!bar) return;
  const to = TAB_ORDER.indexOf(ui.tab);
  requestAnimationFrame(() => { bar.style.transform = `translateX(${to * 100}%)`; });
}

function switchTab(nextTab) {
  if (!TAB_ORDER.includes(nextTab) || nextTab === ui.tab) return;
  const forward = TAB_ORDER.indexOf(nextTab) > TAB_ORDER.indexOf(ui.tab);
  ui.prevTab = ui.tab;
  ui.tab = nextTab;
  ui.tabAnim = forward ? 'from-right' : 'from-left';
  ui.editRoster = false;
  render();
  // 動畫只套用在這次切換，之後的重畫不重播
  ui.tabAnim = null;
  ui.prevTab = null;
  window.scrollTo(0, 0);
}

/**
 * 左右滑動切換分頁：內容會跟著手指移動，放開時超過門檻就切換，否則彈回。
 * 只在判定為水平滑動時攔截，垂直捲動不受影響。
 */
const SWIPE_THRESHOLD = 70;
const swipe = { active: false, decided: false, horizontal: false, x: 0, y: 0, dx: 0 };

function swipeBlocked(target) {
  return !state.players.length
    || ui.manual || ui.result || ui.backup || ui.settings || ui.copyText || ui.titleIndex !== null || ui.report || ui.profileName
    || target.closest('input, textarea, select, .tabbar, .modal-bg');
}

document.addEventListener('touchstart', (event) => {
  if (event.touches.length !== 1 || swipeBlocked(event.target)) return;
  const t = event.touches[0];
  Object.assign(swipe, { active: true, decided: false, horizontal: false, x: t.clientX, y: t.clientY, dx: 0 });
}, { passive: true });

document.addEventListener('touchmove', (event) => {
  if (!swipe.active) return;
  const t = event.touches[0];
  const dx = t.clientX - swipe.x;
  const dy = t.clientY - swipe.y;
  if (!swipe.decided) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    swipe.decided = true;
    swipe.horizontal = Math.abs(dx) > Math.abs(dy) * 1.2;
    if (!swipe.horizontal) {
      swipe.active = false;
      return;
    }
  }
  event.preventDefault();   // 水平滑動時阻止頁面左右晃動
  swipe.dx = dx;
  const index = TAB_ORDER.indexOf(ui.tab);
  const atEdge = (dx > 0 && index === 0) || (dx < 0 && index === TAB_ORDER.length - 1);
  const body = document.getElementById('tab-body');
  if (body) {
    body.style.transition = 'none';
    body.style.transform = `translateX(${dx * (atEdge ? 0.15 : 0.5)}px)`;   // 邊界加阻力
  }
}, { passive: false });

document.addEventListener('touchend', () => {
  if (!swipe.active) return;
  swipe.active = false;
  if (!swipe.horizontal) return;
  const index = TAB_ORDER.indexOf(ui.tab);
  const target = swipe.dx < 0 ? index + 1 : index - 1;
  if (Math.abs(swipe.dx) >= SWIPE_THRESHOLD && target >= 0 && target < TAB_ORDER.length) {
    switchTab(TAB_ORDER[target]);
    return;
  }
  const body = document.getElementById('tab-body');
  if (body) {
    body.style.transition = 'transform 0.2s ease';
    body.style.transform = 'translateX(0)';
  }
});

/* ===================== 場上拖曳交換 ===================== */
/**
 * 長按 0.3 秒啟動拖曳，避免和捲動、左右滑動切換分頁衝突：
 * 長按前手指移動超過 8px 視為捲動或滑動，取消拖曳。
 * 放到同一場地的另一個名字上即交換。
 */
const LONG_PRESS_MS = 300;
const drag = { timer: null, active: false, source: null, ghost: null, target: null, x: 0, y: 0, suppressClick: false };

function dragStart() {
  drag.active = true;
  swipe.active = false;   // 停止分頁滑動判定
  drag.source.classList.add('drag-source');
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.textContent = drag.source.textContent.trim();
  document.body.appendChild(ghost);
  drag.ghost = ghost;
  dragMove(drag.x, drag.y);
  if (navigator.vibrate) navigator.vibrate(15);
}

function dragMove(x, y) {
  drag.ghost.style.left = `${x}px`;
  drag.ghost.style.top = `${y}px`;
  const under = document.elementFromPoint(x, y);
  const chip = under && under.closest('.drag-chip');
  const valid = chip && chip !== drag.source && chip.dataset.court === drag.source.dataset.court ? chip : null;
  if (drag.target && drag.target !== valid) drag.target.classList.remove('drop-target');
  if (valid) valid.classList.add('drop-target');
  drag.target = valid;
}

function dragEnd() {
  clearTimeout(drag.timer);
  drag.timer = null;
  if (!drag.active) {
    drag.source = null;
    return;
  }
  const { source, target } = drag;
  drag.ghost.remove();
  Object.assign(drag, { active: false, source: null, ghost: null, target: null, suppressClick: true });
  setTimeout(() => { drag.suppressClick = false; }, 400);
  if (target && swapOnCourt(Number(source.dataset.court), Number(source.dataset.pid), Number(target.dataset.pid))) {
    saveSession();
    showToast('已交換位置');
  }
  render();
}

function dragPointerDown(target, x, y) {
  const chip = target.closest('.drag-chip');
  if (!chip || chip.classList.contains('no-drag') || ui.manual || ui.result || ui.settings) return;
  drag.source = chip;
  drag.x = x;
  drag.y = y;
  drag.timer = setTimeout(dragStart, LONG_PRESS_MS);
}

function dragPointerMove(event, x, y) {
  if (drag.active) {
    event.preventDefault();
    dragMove(x, y);
  } else if (drag.timer && Math.hypot(x - drag.x, y - drag.y) > 8) {
    clearTimeout(drag.timer);   // 長按前就移動：交給捲動或分頁滑動
    drag.timer = null;
    drag.source = null;
  }
}

document.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) dragPointerDown(e.target, e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (drag.source) dragPointerMove(e, e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
document.addEventListener('touchend', dragEnd);
document.addEventListener('touchcancel', dragEnd);
// 電腦版滑鼠也能拖曳
document.addEventListener('mousedown', (e) => dragPointerDown(e.target, e.clientX, e.clientY));
document.addEventListener('mousemove', (e) => { if (drag.source) dragPointerMove(e, e.clientX, e.clientY); });
document.addEventListener('mouseup', dragEnd);
// 長按名字時不要跳出系統選單
document.addEventListener('contextmenu', (e) => { if (e.target.closest('.drag-chip')) e.preventDefault(); });

/* ===================== 鎖定縮放 ===================== */
/**
 * iOS Safari 會忽略 viewport 的 user-scalable=no（無障礙考量），
 * 因此另外攔截雙指縮放手勢：
 * - gesturestart / gesturechange：iOS 專用的縮放手勢事件
 * - 兩指以上的 touchmove：其他瀏覽器的雙指縮放
 */
['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
  document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
});
document.addEventListener('touchmove', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

/* ===================== 強制更新 ===================== */
/**
 * 1. 先寫入尚未儲存的資料（localStorage 以網域為單位，網址加參數不影響資料）
 * 2. 以 cache: 'reload' 重新下載原網址，順便更新瀏覽器對原網址的快取（主畫面 app 下次開啟用得到）
 * 3. 以帶時間戳的網址重新載入，繞過瀏覽器與 GitHub CDN 的快取
 */
// 在 Claude 等預覽環境中，頁面被包在 iframe 裡，網址帶有預覽專用參數，不能自行導向
function isEmbedded() {
  try {
    return window.self !== window.top;
  } catch (err) {
    return true;   // 跨網域無法讀取 top，同樣視為內嵌
  }
}

async function forceUpdate() {
  if (isEmbedded()) {
    showToast('預覽模式無法更新，請用 GitHub 網址開啟');
    return;
  }
  flushSaves();
  showToast('正在下載最新版…');

  // 保留原網址的路徑、其他參數與錨點，只替換 v 參數
  const url = new URL(window.location.href);
  url.searchParams.delete('v');
  try {
    await fetch(url.toString(), { cache: 'reload' });
  } catch (err) {
    console.warn('預先下載失敗，直接重新載入:', err);
  }
  url.searchParams.set('v', String(Date.now()));
  window.location.replace(url.toString());
}

/* ===================== 事件 ===================== */
function startSession() {
  const typed = parseNames(ui.setupText);
  const names = Array.from(new Set([...regulars.filter((n) => ui.setupSelected.has(n)), ...typed]));
  const needTotal = TEAM_SIZE[ui.setupMode] * 2;
  if (names.length < needTotal) {
    showToast(`${MODE_LABEL[ui.setupMode]}至少需要 ${needTotal} 人`);
    return false;
  }
  if (ui.setupSaveNew) addRegulars(typed);
  state = createDefaultState();
  state.mode = ui.setupMode;
  state.courts = Array.from({ length: ui.setupCourts }, () => ({ match: null }));
  addPlayers(names);
  fillAllEmpty();
  ui.setupText = '';
  ui.setupSelected.clear();
  return true;
}

/**
 * 開新球局：清除場地、場數、配對與歷史，常用球員（regulars）不受影響。
 * 上一局的名單與設定會帶入開始畫面，方便同一批人再開一局。
 */
function startNewDay() {
  const lastNames = state.players.map((p) => p.name);
  ui.setupMode = state.mode;
  ui.setupCourts = state.courts.length;
  ui.setupSelected = new Set(lastNames.filter(isRegular));
  ui.setupText = lastNames.filter((n) => !isRegular(n)).join('\n');
  ui.historyFilter = '';
  ui.historyExpanded = false;
  ui.manual = null;
  state = createDefaultState();
}

function handleAction(el) {
  const action = el.dataset.action;
  const court = Number(el.dataset.court);
  const id = Number(el.dataset.id);
  const name = el.dataset.name;
  let sessionChanged = true;
  let modalOnly = false;   // 只影響彈窗內容的操作，不重畫整頁，避免畫面跳動

  if (action !== 'reset') ui.resetArmed = false;
  // 點勝隊的選擇只在同一張卡片上連續操作時保留
  const pendingWin = ui.pendingWin;
  if (action !== 'win-select') ui.pendingWin = null;
  if (action !== 'history-delete') ui.deleteArmedNo = null;
  if (action !== 'history-clear') ui.clearHistoryArmed = false;
  if (action !== 'end-day' && action !== 'settings-end-day') ui.endDayArmed = false;

  switch (action) {
    /* 開始設定 */
    case 'setup-mode': ui.setupMode = el.dataset.mode; sessionChanged = false; break;
    case 'setup-court-inc': ui.setupCourts = Math.min(MAX_COURTS, ui.setupCourts + 1); sessionChanged = false; break;
    case 'setup-court-dec': ui.setupCourts = Math.max(1, ui.setupCourts - 1); sessionChanged = false; break;
    case 'setup-toggle':
      if (ui.setupSelected.has(name)) ui.setupSelected.delete(name);
      else ui.setupSelected.add(name);
      sessionChanged = false;
      break;
    case 'setup-select-all':
      if (ui.setupSelected.size === regulars.length) ui.setupSelected.clear();
      else regulars.forEach((n) => ui.setupSelected.add(n));
      sessionChanged = false;
      break;
    case 'regular-edit': ui.editRegulars = !ui.editRegulars; sessionChanged = false; break;
    case 'regular-delete': removeRegular(name); sessionChanged = false; break;
    case 'start':
      if (!startSession()) return;
      ui.tab = 'courts';
      break;

    /* 排場 */
    case 'set-mode': state.mode = el.dataset.mode; break;
    case 'set-auto': state.autoFill = el.dataset.value === '1'; break;
    case 'set-fairness': state.fairness = el.dataset.value; break;
    case 'court-inc': setCourtCount(state.courts.length + 1); break;
    case 'court-dec': setCourtCount(state.courts.length - 1); break;
    case 'fill-court': fillCourt(court); break;
    case 'fill-all': fillAllEmpty(); break;
    case 'pause-court': {
      const match = state.courts[court].match;
      if (!match || isPaused(match)) return;
      match.pauses = match.pauses || [];
      match.pauses.push([Date.now(), null]);
      ui.pendingWin = null;
      showToast(`第 ${court + 1} 場地已暫停`);
      break;
    }
    case 'resume-court': {
      const match = state.courts[court].match;
      if (!isPaused(match)) return;
      match.pauses[match.pauses.length - 1][1] = Date.now();
      showToast(`第 ${court + 1} 場地繼續比賽`);
      break;
    }
    case 'win-select': {
      if (drag.suppressClick) {   // 剛結束拖曳，忽略隨後觸發的點擊
        drag.suppressClick = false;
        ui.pendingWin = pendingWin;
        return;
      }
      if (isPaused(state.courts[court].match)) return;   // 暫停中不能選勝方
      const team = el.dataset.team;
      const same = pendingWin && pendingWin.court === court && pendingWin.team === team;
      ui.pendingWin = same ? null : { court, team };   // 再點一次同一邊 = 取消選擇
      sessionChanged = false;
      break;
    }
    case 'win-clear': sessionChanged = false; break;
    case 'win-confirm': {
      const match = pendingWin && state.courts[pendingWin.court].match;
      if (!match) return;
      const winners = pendingWin.team === 'A' ? match.teamA.slice() : match.teamB.slice();
      const names = winners.map(playerName).join('、');
      endMatch(pendingWin.court, winners);
      showToast(`已記錄 ${names} 勝`);
      break;
    }
    case 'end-match':
      // 直接結束（不記勝負）；要記勝負時改點勝隊那一半
      endMatch(court, null);
      showToast(state.autoFill && state.courts[court].match
        ? `第 ${court + 1} 場地已結束，新組合已排上`
        : `第 ${court + 1} 場地已結束`);
      break;
    case 'history-result': {
      const entry = state.history.find((h) => h.no === Number(el.dataset.no));
      ui.result = { kind: 'history', no: Number(el.dataset.no), selected: (entry && entry.winnerIds) ? entry.winnerIds.slice() : [] };
      sessionChanged = false;
      break;
    }
    case 'result-toggle': {
      const ctx = resultContext();
      const picked = ui.result.selected;
      if (picked.includes(id)) picked.splice(picked.indexOf(id), 1);
      else {
        picked.push(id);
        if (ctx && picked.length > ctx.teamA.length) picked.shift();   // 已選滿時，替換最早選的人
      }
      sessionChanged = false;
      modalOnly = true;
      break;
    }
    case 'result-confirm': {
      const r = ui.result;
      const ctx = resultContext();
      if (!ctx || r.selected.length !== ctx.teamA.length) {
        showToast(`請選出勝出的 ${ctx ? ctx.teamA.length : ''} 人`);
        return;
      }
      if (r.kind === 'end') {
        endMatch(r.courtIndex, r.selected.slice());
      } else {
        const entry = state.history.find((h) => h.no === r.no);
        if (entry) applyResult(entry, r.selected.slice());
      }
      ui.result = null;
      break;
    }
    case 'result-skip':
      endMatch(ui.result.courtIndex, null);
      ui.result = null;
      break;
    case 'result-clear': {
      const entry = state.history.find((h) => h.no === ui.result.no);
      if (entry) applyResult(entry, null);
      ui.result = null;
      break;
    }
    case 'cancel-match': cancelMatch(court); break;

    /* 球員 */
    case 'toggle-active': toggleActive(id); break;
    case 'remove-player': removePlayer(id); break;
    case 'toggle-regular': toggleRegular(name); sessionChanged = false; break;
    case 'quick-add': addPlayers([name]); showToast(`已加入 ${name}`); break;
    case 'add-players': {
      const added = addPlayers(parseNames(ui.addText));
      showToast(added ? `已新增 ${added} 人` : '沒有新名字（重複的名字會略過）');
      if (added) ui.addText = '';
      break;
    }

    /* 刪除紀錄：沒有復原功能，改為按兩次確認 */
    case 'history-delete': {
      const matchNo = Number(el.dataset.no);
      if (ui.deleteArmedNo !== matchNo) {
        ui.deleteArmedNo = matchNo;
        sessionChanged = false;
        setTimeout(() => {
          if (ui.deleteArmedNo === matchNo) {
            ui.deleteArmedNo = null;
            render();
          }
        }, 3000);
        break;
      }
      ui.deleteArmedNo = null;
      if (deleteHistory(matchNo)) showToast('已刪除紀錄，場數、等待與配對已回退');
      break;
    }

    case 'rebuild':
      rebuildFromHistory();
      showToast('已依歷史紀錄重新計算場數與配對');
      break;

    case 'history-clear':
      if (!ui.clearHistoryArmed) {
        ui.clearHistoryArmed = true;
        sessionChanged = false;
        setTimeout(() => {
          if (ui.clearHistoryArmed) {
            ui.clearHistoryArmed = false;
            render();
          }
        }, 3000);
        break;
      }
      ui.clearHistoryArmed = false;
      showToast(`已刪除 ${deleteAllHistory()} 場紀錄，場數、等待與配對已回退`);
      break;

    /* 歷史 */
    case 'history-toggle': ui.historyExpanded = !ui.historyExpanded; sessionChanged = false; break;

    /* 手動排場 */
    case 'manual-open': ui.manual = { courtIndex: court, sides: {} }; sessionChanged = false; break;
    case 'manual-replace': {
      /**
       * 已排好的場地改為手動：先取消原本那場（回退場數、等待、配對），
       * 再以原名單開啟手動排場。確認後才算數；關閉則還原，資料也不會先寫入儲存。
       */
      const match = state.courts[court].match;
      if (!match) break;
      const restore = JSON.stringify(state);
      const sides = {};
      match.teamA.forEach((pid) => { sides[pid] = 'A'; });
      match.teamB.forEach((pid) => { sides[pid] = 'B'; });
      // 記下原本的計時狀態，確認換人後接續
      const now = Date.now();
      const clock = {
        clockStart: match.clockStart || match.startedAt,
        carriedPausedMs: (match.carriedPausedMs || 0) + pausedMs(match, now),
        wasPaused: isPaused(match),
      };
      cancelMatch(court);
      ui.manual = { courtIndex: court, sides, restore, openedAt: openedAtOf(match), clock };
      sessionChanged = false;
      break;
    }
    case 'manual-side': {
      const side = el.dataset.side;
      if (ui.manual.sides[id] === side) delete ui.manual.sides[id];
      else ui.manual.sides[id] = side;
      sessionChanged = false;
      modalOnly = true;
      break;
    }
    case 'manual-auto-split':
      manualAutoSplit();
      sessionChanged = false;
      modalOnly = true;
      break;
    case 'manual-confirm':
      if (!manualConfirm()) return;
      ui.manual = null;
      break;

    /* 備份 */
    case 'backup-open': ui.backup = { text: buildBackup() }; ui.settings = false; sessionChanged = false; break;
    case 'backup-copy': {
      const area = document.getElementById('backup-text');
      area.select();
      const done = () => showToast('已複製');
      if (navigator.clipboard) navigator.clipboard.writeText(area.value).then(done, () => showToast('請長按文字手動複製'));
      else showToast('請長按文字手動複製');
      return;
    }
    case 'backup-restore':
      try {
        restoreBackup(document.getElementById('backup-text').value);
        saveRegulars();
        ui.backup = null;
        showToast('已還原');
      } catch (err) {
        showToast(`還原失敗：${err.message}`);
        return;
      }
      break;
    case 'tab':
      switchTab(el.dataset.tab);
      return;
    case 'roster-edit': ui.editRoster = !ui.editRoster; sessionChanged = false; break;
    case 'end-day':
      if (!ui.endDayArmed) {
        ui.endDayArmed = true;
        sessionChanged = false;
        setTimeout(() => { if (ui.endDayArmed) { ui.endDayArmed = false; render(); } }, 4000);
        break;
      }
      ui.endDayArmed = false;
      endDay();
      saveSession();
      render();
      openReport();
      return;
    case 'settings-end-day':
      ui.settings = false;
      ui.tab = 'records';
      ui.endDayArmed = !state.dayEnded;
      sessionChanged = false;
      break;
    case 'report-open': openReport(); return;
    case 'report-share': shareReport(); return;
    case 'player-open': ui.profileName = el.dataset.name; sessionChanged = false; break;
    case 'network-focus':
      ui.networkFocus = ui.networkFocus === el.dataset.name ? null : el.dataset.name;
      sessionChanged = false;
      break;
    case 'title-open': ui.titleIndex = Number(el.dataset.index); sessionChanged = false; break;
    case 'settings-open': ui.settings = true; sessionChanged = false; break;
    case 'set-appearance':
      prefs.appearance = el.dataset.value;
      applyAppearance();
      savePrefs();
      sessionChanged = false;
      break;
    case 'set-theme':
      prefs.courtTheme = el.dataset.value;
      applyCourtTheme();
      savePrefs();
      sessionChanged = false;
      break;
    case 'set-awake': state.keepAwake = el.dataset.value === '1'; break;
    case 'copy-lineup':
      copyLineup();
      return;
    case 'force-update':
      forceUpdate();
      return;
    case 'modal-close':
      if (ui.manual && ui.manual.restore) state = JSON.parse(ui.manual.restore);   // 改為手動但沒確認：還原原本的排場
      ui.manual = null;
      ui.backup = null;
      ui.result = null;
      ui.settings = false;
      ui.copyText = null;
      ui.titleIndex = null;
      ui.profileName = null;
      ui.report = null;
      sessionChanged = false;
      break;

    case 'reset':
      if (!ui.resetArmed) {
        ui.resetArmed = true;
        sessionChanged = false;
        setTimeout(() => { ui.resetArmed = false; render(); }, 3000);
      } else {
        ui.resetArmed = false;
        startNewDay();
        ui.settings = false;
        ui.tab = 'courts';
        showToast('已清除排場紀錄，常用球員已保留');
      }
      break;
    default:
      return;
  }

  if (sessionChanged) saveSession();
  if (modalOnly) renderModal();
  else render();
  syncWakeLock();   // 在使用者點擊當下申請，iOS 才會允許
}

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-action]');
  if (!el) return;
  // 只有直接點到 modal 背景才關閉；modal 內部非按鈕區域的點擊會冒泡到背景，需略過
  if (el.classList.contains('modal-bg') && event.target !== el) return;
  handleAction(el);
});

// 輸入框內容存進 ui，避免重新渲染時被清掉
document.addEventListener('input', (event) => {
  const { id, value } = event.target;
  if (id === 'names') {
    ui.setupText = value;
    const total = new Set([...ui.setupSelected, ...parseNames(value)]).size;
    const counter = document.getElementById('setup-total');
    if (counter) counter.textContent = total;
  } else if (id === 'add-names') {
    ui.addText = value;
  }
});

document.addEventListener('change', (event) => {
  const { id } = event.target;
  if (id === 'save-new') {
    ui.setupSaveNew = event.target.checked;
  } else if (id === 'history-filter') {
    ui.historyFilter = event.target.value;
    ui.historyExpanded = false;
    render();
  }
});

loadAll();
render();
</script>
</body>
</html>
