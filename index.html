<!-- 安卓：App 資訊與可填滿的圖示（需要和 index.html 放在同一個資料夾） -->
<link rel="manifest" href="manifest.webmanifest">
<title>羽球輪轉排場</title>
<style>
  :root {
    --floor: #E9EEE6;
    --ink: #14261C;
    --muted: #5B6B61;
    --court: #2D6A4F;
    --court-dark: #1B4332;
    --line: #F7F7F2;
    --tape: #F2C94C;
    --danger: #B23A2E;
    --surface: #FFFFFF;
    --border: #C9D3C8;
    --row-court: #DCEFE3;
    --row-rest: #E2E4E7;
    --soft-yellow: #FFF6D6;
    --on-tape: #14261C;      /* 黃色底上的文字，兩種模式都用深色 */
    --radius-s: 6px;
    --radius-l: 14px;
    color-scheme: light;
  }
  /* 夜間模式：只換頁面與面板的配色，場地卡片沿用場地配色主題 */
  :root[data-appearance="dark"] {
    color-scheme: dark;
    --floor: #111713;
    --surface: #1B231E;
    --ink: #E4ECE6;
    --muted: #97A89D;
    --border: #34423A;
    --court-dark: #3F8F68;
    --row-court: #1E3A2B;
    --row-rest: #262B28;
    --soft-yellow: #3A3320;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--floor) !important; }
  /* 鎖定縮放：取消雙擊放大（捲動與點擊不受影響） */
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* 部分預覽環境（如 Claude app）會強制深色底，改由獨立容器鋪滿背景 */
  .page { background: var(--floor); min-height: 100vh; color: var(--ink); }
  body {
    margin: 0; min-height: 100vh;
    background: var(--floor); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  :root { --wrap-max: 560px; }
  .wrap {
    max-width: var(--wrap-max); margin: 0 auto;
    padding: 20px max(16px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  /* 頂部列 */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .top h1 { font-size: 22px; }
  .top .sub { margin: 0; }
  .top-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .top-actions button { padding: 8px 12px; font-size: 14px; font-weight: 600; border: 2px solid var(--court-dark); }
  .top-actions .btn-copy { background: var(--tape); border-color: var(--tape); }

  /* 底部分頁 */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center;
    background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar-inner { display: flex; width: 100%; max-width: var(--wrap-max); }
  .tabbar button {
    flex: 1; background: transparent; border-radius: 0; padding: 12px 4px 14px;
    font-size: 16px; font-weight: 600; color: var(--muted); border-top: 3px solid transparent;
  }
  .tabbar button[aria-selected="true"] { color: var(--court-dark); border-top-color: var(--tape); }
  .tabbar small { display: block; font-size: 12px; font-weight: 400; }

  .tabbar-inner { position: relative; }
  .tab-indicator {
    position: absolute; top: 0; left: 0; height: 3px; background: var(--tape);
    width: calc(100% / 3); transition: transform 0.25s ease;
  }
  .tabbar button[aria-selected="true"] { border-top-color: transparent; }
  /* 在分頁列上左右滑動：指示條跟著手指，手指所在的分頁先亮起來 */
  .tabbar.scrubbing .tab-indicator { transition: none; height: 4px; }
  .tabbar { touch-action: pan-y; }
  .tab-body { touch-action: pan-y; will-change: transform; }
  @media (prefers-reduced-motion: no-preference) {
    .tab-body.from-right { animation: tab-from-right 0.22s ease-out; }
    .tab-body.from-left { animation: tab-from-left 0.22s ease-out; }
    @keyframes tab-from-right { from { transform: translateX(40px); opacity: 0.3; } to { transform: none; opacity: 1; } }
    @keyframes tab-from-left { from { transform: translateX(-40px); opacity: 0.3; } to { transform: none; opacity: 1; } }
  }
  .section-title { display: flex; justify-content: space-between; align-items: baseline; }
  tr.on-court td { background: var(--row-court); }
  tr.on-court td:first-child { box-shadow: inset 4px 0 0 var(--court); }
  td.actions button.btn-remove { background: var(--danger); color: #fff; }
  .settings-divider { border: 0; border-top: 1px solid var(--floor); margin: 18px 0 8px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: 0.02em; color: var(--ink); }
  h2 { font-size: 18px; margin: 28px 0 10px; color: var(--ink); }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .num { font-variant-numeric: tabular-nums; }

  button {
    font: inherit; border: 0; cursor: pointer;
    border-radius: var(--radius-s); padding: 8px 14px;
    background: var(--surface); color: var(--ink);
  }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 3px solid var(--tape); outline-offset: 2px;
  }
  .btn-primary { background: var(--court-dark); color: var(--line); font-weight: 600; }
  .btn-tape { background: var(--tape); color: var(--on-tape); font-weight: 600; }
  .btn-ghost { background: transparent; color: inherit; text-decoration: underline; padding: 8px 6px; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-block { width: 100%; padding: 12px; }

  textarea, input[type="text"], select {
    width: 100%; font: inherit; padding: 10px 12px; color: var(--ink);
    border: 2px solid var(--border); border-radius: var(--radius-s); background: var(--surface);
  }
  textarea { min-height: 110px; resize: vertical; }
  select { width: auto; padding: 6px 10px; }

  .panel { background: var(--surface); border-radius: var(--radius-l); padding: 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row + .row { margin-top: 12px; }
  .label { min-width: 72px; color: var(--muted); font-size: 14px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; }

  .banner {
    background: var(--soft-yellow); border: 2px solid var(--tape); border-radius: var(--radius-s);
    padding: 10px 12px; font-size: 14px; margin-bottom: 14px;
    display: flex; gap: 10px; align-items: center; justify-content: space-between;
  }

  .seg { display: inline-flex; background: var(--floor); border-radius: var(--radius-s); padding: 3px; }
  .seg button { background: transparent; padding: 6px 14px; }
  .seg button[aria-pressed="true"] { background: var(--court-dark); color: var(--line); }

  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper button { width: 36px; height: 36px; padding: 0; background: var(--floor); font-size: 18px; }
  .stepper span { min-width: 28px; text-align: center; font-weight: 700; }

  /* 球場：本工具唯一的視覺主角 */
  /* 場地卡片：寬度夠時自動並排（手機直式 1 欄、橫式與平板 2～3 欄） */
  .courts { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
  .courts-layout { display: block; }
  /* 場地配色主題：只影響場地卡片，由 <html data-court-theme> 切換 */
  .court {
    --c-card: #2D6A4F; --c-floor: #2F7353; --c-floor-image: none;
    --c-chip: rgba(27, 67, 50, 0.92); --c-line: #F7F7F2; --c-net: #FFFFFF; --c-alt: #1B4332;
  }
  [data-court-theme="blue"] .court {
    --c-card: #1D4E7A; --c-floor: #2B679C; --c-chip: rgba(13, 40, 66, 0.92); --c-alt: #12324F;
  }
  [data-court-theme="wood"] .court {
    --c-card: #6B4426; --c-floor: #C48A52; --c-chip: rgba(70, 40, 16, 0.92); --c-alt: #4A2E17;
    --c-floor-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 46px),
                     repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 13px);
  }
  [data-court-theme="night"] .court {
    --c-card: #141B2D; --c-floor: #1C2640; --c-chip: rgba(0, 0, 0, 0.65);
    --c-line: #B8FF5C; --c-net: #FFE45C; --c-alt: #0B1020;
  }
  .court { background: var(--c-card); color: var(--line); border-radius: var(--radius-l); padding: 12px; }
  .court-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .court-name { font-weight: 700; font-size: 17px; }
  .court-meta { font-size: 13px; opacity: 0.85; display: inline-flex; align-items: center; gap: 6px; }
  .pause-btn {
    background: rgba(255, 255, 255, 0.16); color: var(--line); padding: 2px 9px; font-size: 13px;
    border-radius: 999px; line-height: 1.4;
  }
  .paused-tag {
    background: var(--tape); color: var(--on-tape); font-weight: 700; padding: 2px 10px; border-radius: 999px;
    font-size: 13px; line-height: 1.4;
  }
  .court-map.is-paused::after {
    content: "暫停中"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.35); color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 0.1em;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.8), 0 0 2px rgba(0, 0, 0, 0.9);
    pointer-events: none; border-radius: 3px;
  }
  .court-alert {
    background: var(--tape); color: var(--on-tape); border-radius: var(--radius-s);
    padding: 6px 10px; font-size: 14px; font-weight: 600; margin-bottom: 8px;
  }
  .court-lines {
    position: relative; border: 2px solid var(--line); border-radius: 2px;
    display: grid; grid-template-rows: 1fr 1fr; min-height: 150px;
  }
  .court-lines::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
    border-left: 1px solid rgba(247, 247, 242, 0.45);
  }
  .court-lines::after {
    content: ""; position: absolute; left: -6px; right: -6px; top: 50%;
    border-top: 3px dashed var(--line); transform: translateY(-50%);
  }
  .half {
    position: relative; z-index: 1;
    display: flex; justify-content: space-around; align-items: center;
    padding: 12px 8px; font-size: 18px; font-weight: 600; text-align: center;
  }
  .half .name-chip { background: var(--court-dark); padding: 4px 10px; border-radius: var(--radius-s); }
  button.half {
    width: 100%; background: transparent; color: var(--line); border-radius: 0;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  button.half.picked { background: rgba(242, 201, 76, 0.38); }
  button.half.picked .name-chip { background: var(--tape); color: var(--on-tape); }
  button.half.dimmed { opacity: 0.45; }
  .win-flag {
    position: absolute; top: 6px; left: 8px; padding: 1px 6px !important; font-size: 12px;
    background: var(--on-tape) !important; color: var(--tape) !important;
  }
  /* 拖曳交換：長按名字後可拖到另一個名字上 */
  /* 每位球員佔滿所在半場的一格，整格都能長按拖曳、也都能當放置目標 */
  button.half { padding: 0; align-items: stretch; min-height: 75px; }

  /* 真實球場：雙打場地 13.4m × 6.1m，球網在中間，左半場 A 隊、右半場 B 隊 */
  .court-map {
    position: relative; aspect-ratio: 13.4 / 6.1; width: 100%; border-radius: 3px;
    background-color: var(--c-floor); background-image: var(--c-floor-image);
  }
  .court-map svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .court-map line, .court-map rect { stroke: var(--c-line); vector-effect: non-scaling-stroke; fill: none; }
  .court-map .net { stroke: var(--c-net); }
  /* 暫停中的半場：版面必須和可點的 button.half 完全相同（無內距），名字才不會位移 */
  .court-map .half.locked {
    position: absolute; top: 0; bottom: 0; width: 50%; display: flex; flex-direction: column;
    align-items: stretch; padding: 0; color: var(--line); cursor: default;
  }
  .court-map .half.locked.side-A { left: 0; }
  .court-map .half.locked.side-B { right: 0; }
  .court-map button.half {
    position: absolute; top: 0; bottom: 0; width: 50%; min-height: 0;
    flex-direction: column;   /* 雙打兩人分別在上下發球區 */
  }
  .court-map button.half.side-A { left: 0; }
  .court-map button.half.side-B { right: 0; }
  /* 名字置中在發球區內：
     橫向介於雙打後發球線(0.76m)與前發球線(4.72m) → 中心 2.74m，佔半場 6.7m 的 40.9%
     縱向：上發球區介於單打邊線(0.46m)與中線(3.05m) → 佔上半格的 57.5%；下發球區對稱為 42.5% */
  .court-map .drag-chip { position: relative; padding: 0; display: block; }
  .court-map .name-chip {
    position: absolute; transform: translate(-50%, -50%);
    background: var(--c-chip); font-size: 17px; font-weight: 600;
    max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .court-map .side-A .name-chip { left: 40.9%; }
  .court-map .side-B .name-chip { left: 59.1%; }
  .court-map .slot-top .name-chip { top: 57.5%; }
  .court-map .slot-bottom .name-chip { top: 42.5%; }
  .court-map .slot-only .name-chip { top: 50%; }
  .court-map.empty { display: flex; align-items: center; justify-content: center; }
  .court-map.empty svg { opacity: 0.45; }
  .court-map .empty-label {
    position: relative; font-weight: 600; background: var(--c-chip);
    padding: 4px 12px; border-radius: var(--radius-s);
  }
  .drag-chip {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px 4px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    border-radius: var(--radius-s); transition: background 0.12s ease;
  }
  .drag-chip.drag-source { opacity: 0.35; }
  .bench-chip { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  .bench-chip.drag-source { opacity: 0.35; }
  .bench-chip.drop-target { background: var(--tape); color: var(--on-tape); }

  /* ===== 場邊（板凳區）：沿用場地卡片的配色變數，看起來像球場旁的場邊 ===== */
  .courts-side { margin-top: 14px; }
  .sideline .sideline-floor {
    position: relative; border-radius: 3px; padding: 22px 10px 10px;
    background-color: var(--c-floor); background-image: var(--c-floor-image);
  }
  /* 頂端白線：球場邊線，板凳就在線外 */
  .sideline .sideline-line {
    position: absolute; left: 0; right: 0; top: 8px; height: 0;
    border-top: 2px solid var(--c-line); opacity: 0.85;
  }
  .sideline .bench-area { --wood: #C79A64; --wood-dark: #8A5A30; --wood-grain: rgba(60, 30, 10, 0.18); }
  [data-court-theme="wood"] .sideline .bench-area { --wood: #6B4426; --wood-dark: #3E2612; }
  .sideline .bench-seats { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); padding: 0 4px; gap: 5px; }
  .sideline .seat b { font-size: 14px; }
  .sideline .bench-label { color: var(--c-line); }
  .sideline .bench-label small { color: var(--c-line); opacity: 0.75; }
  .sideline .seat {
    background: var(--c-chip); color: var(--line); border: 2px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
  }
  .sideline .seat small { color: var(--line); opacity: 0.7; }
  .sideline .seat-next { border-color: var(--tape); }
  .sideline .seat-next small { color: var(--tape); opacity: 1; }
  .sideline .seat-must { border-color: var(--danger); }
  .sideline .seat-rest { opacity: 0.5; }
  .sideline .bench-empty { color: var(--c-line); opacity: 0.8; }
  .sideline .seat.drop-target { background: var(--tape); color: var(--on-tape); }
  :root[data-appearance="dark"] .sideline .seat-next,
  :root[data-appearance="dark"] .sideline .seat { background: var(--c-chip); color: var(--line); }

  /* ===== 板凳區 ===== */
  .bench-area {
    --wood: #B7834F; --wood-dark: #8A5A30; --wood-grain: rgba(60, 30, 10, 0.12);
    --cushion: #FFFFFF; --cushion-edge: #D9CDBF;
    display: grid; gap: 14px;
  }
  :root[data-appearance="dark"] .bench-area {
    --wood: #7A5434; --wood-dark: #553821; --wood-grain: rgba(0, 0, 0, 0.25);
    --cushion: #26302A; --cushion-edge: #3B4740;
  }
  /* 標籤放在長椅上方，讓長椅佔滿整個寬度：手機上一排可以坐 4 人 */
  .bench-row { display: grid; gap: 6px; }
  .bench-label { font-weight: 700; font-size: 15px; color: var(--ink); line-height: 1.2; }
  .bench-label small { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
  .bench { position: relative; padding-bottom: 16px; }
  .bench-seats {
    position: relative; z-index: 2;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px;
    padding: 0 8px; margin-bottom: -6px;   /* 坐墊稍微壓在木板上 */
  }
  .bench-plank {
    position: relative; z-index: 1; height: 16px; border-radius: 5px;
    background:
      repeating-linear-gradient(90deg, transparent 0 46px, var(--wood-grain) 46px 48px),
      linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%);
    box-shadow: 0 3px 0 var(--wood-dark), 0 6px 10px rgba(0, 0, 0, 0.15);
  }
  .bench-legs { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; }
  .bench-legs i {
    position: absolute; bottom: 0; width: 8px; height: 16px; border-radius: 0 0 3px 3px;
    background: var(--wood-dark);
  }
  .bench-legs i:first-child { left: 14%; }
  .bench-legs i:last-child { right: 14%; }

  .seat {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 54px; padding: 6px 4px; border-radius: 12px 12px 6px 6px;
    background: var(--cushion); border: 2px solid var(--cushion-edge); color: var(--ink);
    box-shadow: 0 2px 0 var(--cushion-edge); text-align: center; cursor: grab;
  }
  .seat b { font-size: 15px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat small { font-size: 11px; color: var(--muted); }
  .seat-next { background: #FFF1C4; border-color: var(--tape); box-shadow: 0 2px 0 #D9AE2F; color: #3A2A00; }
  .seat-next small { color: #7A6420; }
  :root[data-appearance="dark"] .seat-next { background: #4A3D14; color: #FFE9A8; box-shadow: 0 2px 0 #2E2508; }
  :root[data-appearance="dark"] .seat-next small { color: #E6C35C; }
  .seat-must { border-color: var(--danger); box-shadow: 0 2px 0 var(--danger); }
  .seat-flag {
    position: absolute; top: -9px; right: -4px; font-style: normal; font-size: 11px; font-weight: 700;
    background: var(--danger); color: #fff; padding: 0 6px; border-radius: 999px;
  }
  .seat-rest { opacity: 0.6; cursor: default; filter: grayscale(1); }
  .row-rest .bench-plank { filter: grayscale(0.7); }
  .bench-empty { grid-column: 1 / -1; text-align: center; font-size: 13px; color: var(--muted); padding: 14px 0 10px; }
  .seat.drag-source { opacity: 0.35; }
  .seat.drop-target { background: var(--tape); color: var(--on-tape); }
  .drag-chip.drop-target { background: rgba(242, 201, 76, 0.45); }
  .drag-chip.drop-target .name-chip { outline: 3px solid var(--tape); outline-offset: 2px; }
  .drag-ghost {
    position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -60%) scale(1.12);
    background: var(--tape); color: var(--on-tape); padding: 6px 14px; border-radius: var(--radius-s);
    font-size: 18px; font-weight: 700; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); white-space: nowrap;
  }
  .court-hint { font-size: 12px; opacity: 0.75; margin-top: 6px; text-align: center; }
  .court-empty {
    min-height: 150px; border: 2px dashed rgba(247, 247, 242, 0.5); border-radius: 2px;
    display: flex; align-items: center; justify-content: center; opacity: 0.85;
  }
  .court-actions { display: flex; gap: 8px; margin-top: 10px; }
  .court-actions button { flex: 1; }
  .court .btn-ghost { flex: 0 0 auto; color: var(--line); }
  .court .btn-court-alt { flex: 0 0 auto; background: var(--c-alt); color: var(--line); }
  .theme-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .theme-swatches button {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    background: var(--floor); border: 2px solid transparent; font-size: 14px;
  }
  .theme-swatches button[aria-pressed="true"] { border-color: var(--court-dark); font-weight: 700; }
  .swatch { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border); }

  /* 今日稱號 */
  .titles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .title-card {
    display: block; width: 100%; text-align: left; font: inherit; color: var(--ink);
    background: var(--surface); border-radius: var(--radius-l); padding: 12px; border-left: 5px solid var(--tape);
  }
  .title-card:active { background: var(--soft-yellow); }
  .rare-head { margin: 0 0 8px; font-weight: 700; color: #B8860B; }
  .title-card.rare {
    border-left-color: #D4A017;
    background: linear-gradient(135deg, #FFF8DC 0%, #FFE9A8 100%);
    box-shadow: 0 0 0 2px #E6C35C, 0 4px 14px rgba(212, 160, 23, 0.35);
    color: #3A2A00;
  }
  .title-card.rare .t-head { color: #8A6A00; }
  :root[data-appearance="dark"] .title-card.rare { background: linear-gradient(135deg, #3A3010 0%, #5A4410 100%); color: #FFE9A8; }
  :root[data-appearance="dark"] .title-card.rare .t-head { color: #E6C35C; }
  :root[data-appearance="dark"] .rare-head { color: #E6C35C; }
  .title-card .t-more { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .title-modal .t-big { font-size: 44px; line-height: 1; }
  .title-modal .t-who { font-size: 22px; font-weight: 700; margin: 8px 0 4px; overflow-wrap: anywhere; }
  .title-modal .t-fact { font-size: 16px; margin: 0 0 14px; }
  .title-modal .t-rule { background: var(--floor); border-radius: var(--radius-s); padding: 10px 12px; font-size: 14px; color: var(--muted); }
  .title-card .t-head { font-size: 13px; color: var(--muted); }
  .title-card .t-icon { font-size: 20px; margin-right: 4px; }
  .title-card .t-name { font-size: 17px; font-weight: 700; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .title-card .t-detail { font-size: 13px; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--surface); border: 2px solid var(--tape); border-radius: 999px;
    padding: 4px 12px; font-size: 15px; color: var(--ink);
  }
  .chip small { margin-left: 6px; font-size: 12px; color: var(--muted); }
  .chip-wait { border-color: var(--border); }
  button.chip { border-color: var(--border); }
  button.chip[aria-pressed="true"] { background: var(--court-dark); border-color: var(--court-dark); color: var(--line); }
  button.chip.removable { border-color: var(--danger); color: var(--danger); }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-l); overflow: hidden; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--floor); font-size: 15px; }
  th { font-size: 13px; color: var(--muted); font-weight: 500; }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions button { padding: 4px 8px; font-size: 13px; background: var(--floor); }
  .star { background: transparent; padding: 0 4px; font-size: 16px; color: #B8940F; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .badge-court { background: var(--court); color: var(--line); }
  /* 體力條：名字下方的細長條，數字在右側 */
  .stamina { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .stamina-track { flex: 0 0 64px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .stamina-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
  .stamina-fill.high { background: #3BAA6B; }
  .stamina-fill.mid { background: var(--tape); }
  .stamina-fill.low { background: var(--danger); }
  .stamina-num { font-size: 11px; color: var(--muted); min-width: 22px; }
  .badge-wait { background: var(--floor); color: var(--ink); }
  .badge-rest { background: #6B7280; color: #fff; }
  tr.resting td { background: var(--row-rest); color: var(--muted); }
  tr.resting .name { text-decoration: line-through; }
  td.actions button.btn-return { background: var(--tape); font-weight: 600; }
  .resting-list { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .resting-list .badge { margin-right: 6px; }

  .history { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--radius-l); }
  .history li { padding: 10px 14px; border-bottom: 1px solid var(--floor); }
  .history-item { position: relative; padding-right: 92px !important; }
  .history-delete.armed { background: var(--danger); color: #fff; font-weight: 600; }
  .history-delete {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    padding: 4px 10px; font-size: 13px; background: var(--floor);
  }

  .history li:last-child { border-bottom: 0; }
  .history .meta { font-size: 13px; color: var(--muted); }
  .history .teams { font-size: 15px; }
  .history .vs { color: var(--muted); margin: 0 6px; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(20, 38, 28, 0.55);
    display: flex; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .modal {
    background: var(--surface); width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto;
    border-radius: var(--radius-l) var(--radius-l) 0 0; padding: 18px 16px 24px;
    overscroll-behavior: contain;   /* 捲到底時不帶動後方頁面 */
  }
  /* 下拉關閉：頂端的小橫條提示可以往下推 */
  .sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: -8px auto 12px; }
  .modal.dragging { transition: none; }
  .modal.sheet-release { transition: transform 0.2s ease; }
  .modal-bg.sheet-fade { transition: background 0.2s ease; }
  body.modal-open { overflow: hidden; }
  .modal h3 { margin: 0 0 4px; font-size: 18px; }
  .pick-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--floor); }
  .pick-row .who small { color: var(--muted); margin-left: 6px; }
  .side-btns button { width: 44px; margin-left: 6px; background: var(--floor); font-weight: 700; }
  .side-btns button[aria-pressed="true"] { background: var(--court-dark); color: var(--line); }
  .modal-foot { display: flex; gap: 8px; margin-top: 14px; }
  .modal-foot button:disabled { opacity: 0.4; cursor: default; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .result-grid button { padding: 16px 8px; font-size: 18px; font-weight: 600; background: var(--floor); }
  .result-grid button[aria-pressed="true"] { background: var(--court-dark); color: var(--line); }
  .win-tag { display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: var(--radius-s);
    background: var(--tape); color: var(--on-tape); font-size: 12px; font-weight: 700; }
  .swap-tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: var(--radius-s);
    background: var(--floor); color: var(--muted); font-size: 12px; white-space: nowrap; vertical-align: middle; }
  .history-result { margin-top: 6px; padding: 3px 10px; font-size: 13px; background: var(--floor); }
  .stats td.rate { font-weight: 700; }
  .modal-foot button { flex: 1; padding: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #0E1511; color: #F7F7F2; padding: 10px 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); border-radius: var(--radius-s);
    font-size: 15px; z-index: 20; max-width: 90vw;
  }
  @media (prefers-reduced-motion: no-preference) {
    .modal.modal-enter { animation: rise 0.18s ease-out; }
    @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  }
  /* 結束今日打球 */
  .end-day { display: flex; gap: 10px; align-items: center; justify-content: space-between;
    background: var(--surface); border-radius: var(--radius-l); padding: 12px 14px; margin-bottom: 4px; }
  .end-day .sub { margin: 0; }
  .day-ended { background: var(--soft-yellow); border: 2px solid var(--tape); border-radius: var(--radius-l);
    padding: 12px 14px; margin-bottom: 14px; }
  .day-ended .row { margin-top: 8px; }
  .report-img { width: 100%; border-radius: var(--radius-s); border: 1px solid var(--border); display: block; }

  /* 勝率預測 */
  .predict { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 0 0 14px; color: var(--line); }
  .predict.muted { opacity: 0.7; }
  .predict-bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.25); overflow: hidden; }
  .predict-bar div { height: 100%; background: var(--tape); }
  .upset-tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: var(--radius-s);
    background: var(--danger); color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; vertical-align: middle; }

  /* 球員個人頁 */
  .name-btn { background: transparent; padding: 0; font: inherit; color: inherit; text-decoration: underline;
    text-decoration-color: var(--border); text-underline-offset: 3px; }
  .profile-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 14px; }
  .profile-stats div { background: var(--floor); border-radius: var(--radius-s); padding: 8px 4px; text-align: center; }
  .profile-stats b { display: block; font-size: 20px; }
  .profile-stats small { color: var(--muted); font-size: 12px; }

  /* ===== 響應式排版 ===== */

  /* 平板橫式、大螢幕：場地在左、場下等待固定在右側 */

  /* 場邊：寬螢幕（手機橫式、平板直式）把三排長椅並排，避免拉得很長 */

    .top { margin-bottom: 6px; }

<body>
<div class="page"><div class="wrap" id="app">載入中…</div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
'use strict';

/* ===================== 常數 ===================== */
const STORAGE_KEYS = {
  session: 'badminton-session',
  regulars: 'badminton-regulars',
  prefs: 'badminton-prefs',     // 裝置偏好：場地配色等，開新球局不會清除
};
const COURT_THEMES = {
  green: { label: '綠色地墊', swatch: '#2F7353' },
  blue: { label: '藍色地墊', swatch: '#2B679C' },
  wood: { label: '木地板', swatch: '#C48A52' },
  night: { label: '夜光', swatch: '#1C2640' },
};
// 版本規則：小修改只加後面的數字且不進位（3.9 → 3.10 → 3.11）；大更新才進位最前面的數字（4.0）
const APP_VERSION = '3.52';
const BACKUP_VERSION = 1;
const TEAM_SIZE = { doubles: 2, singles: 1 };
const MODE_LABEL = { doubles: '雙打', singles: '單打' };
const PARTNER_WEIGHT = 4;    // 重複同隊的懲罰（取次數平方：第 2 次 16、第 3 次 36，避免同一對一再搭檔）
const GROUP_COUNT_WEIGHT = 40; // 同一批 4 人今晚每打過一次的懲罰（不限近期）
const OPPONENT_WEIGHT = 1;   // 重複對戰的懲罰
const WAIT_WEIGHT = 1;       // 連續等待的加分（取平方）；主要防呆由連等上限負責
const BENCH_WEIGHT = 6;      // 累計等待的加分（與候選池最低值比較）：平衡的主要依據
// 公平偏好：累計等待比平均多幾場，就把優先度提前一級（等同少打一場）
const FAIRNESS_STEP = { played: Infinity, balanced: 2, wait: 1 };
const FAIRNESS_LABEL = { played: '場數優先', balanced: '平衡', wait: '等待優先' };
const CANDIDATE_LIMIT = 12;  // 候選人上限，控制組合數量（C(12,4) = 495 組）
// 為了避開重複組合，改排「優先級低一級」的人時，每人每級的成本。
// 場數優先模式提高成本：場數差距最多 2 場，代價是 3 人重疊的機率較高
const LEVEL_COST_BY_FAIRNESS = { played: 60, balanced: 20, wait: 20 };
// 近期重複懲罰：越近期出現過的組合扣越多，避免同組合連續出現
const RECENT_GROUP_WEIGHT = 24;     // 同一批 4 人（不論怎麼分隊）
const RECENT_PARTNER_WEIGHT = 12;   // 同一對搭檔
const RECENT_OPPONENT_WEIGHT = 3;   // 同一對對手
const RECENT_TOGETHER_WEIGHT = 30;  // 兩人近期同場過（不論搭檔或對手），每一對的懲罰：避免下一場又有 3 人相同
const MAX_COURTS = 8;
const HISTORY_LIMIT = 300;   // 歷史上限，避免儲存資料無限增長
const HISTORY_PREVIEW = 10;

/* ===================== 狀態 ===================== */
function createDefaultState() {
  return {
    mode: 'doubles',
    autoFill: true,
    fairness: 'played',
    keepAwake: true,    // 螢幕常亮
    dayEnded: false,    // 已按「結束今日打球」；再開任何一場就自動解除
    players: [],        // {id, name, played, offset, wait, benched, benchOffset, lastStartSeq, active}
    courts: [{ match: null }, { match: null }],
    pairs: {},          // "idA|idB": {partner, opponent}
    history: [],        // {no, court, mode, isManual, teamA:[name], teamB:[name], startedAt, endedAt}
    finishedCount: 0,
    startSeq: 0,        // 開局流水號：比較先後用，避免同一毫秒開多場時時間戳相同
    nextId: 1,
  };
}

let state = createDefaultState();
let regulars = [];      // 常用球員名字，跨場次保存
let prefs = { courtTheme: 'green', appearance: 'light' };   // appearance: 'light' | 'dark' | 'auto'
const APPEARANCE_LABEL = { light: '淺色', dark: '夜間', auto: '跟隨系統' };

const ui = {
  setupCourts: 2,
  setupMode: 'doubles',
  setupSelected: new Set(),
  setupText: '',
  setupSaveNew: true,
  editRegulars: false,
  tab: 'courts',        // 'courts' | 'players' | 'records'
  titleIndex: null,     // 正在查看的稱號
  profileName: null,    // 正在查看的球員個人頁
  networkFocus: null,   // 關係圖中被點選的球員
  networkMode: 'partner',   // 'partner' 搭檔 | 'rival' 對戰
  endDayArmed: false,
  report: null,         // 戰報圖片 {url, blob, fileName}
  pendingWin: null,     // 在場地上點選的勝隊 {court, team}，確認後才結束
  settings: false,
  editRoster: false,
  copyText: null,       // 剪貼簿無法使用時，改用彈窗讓使用者手動複製
  addText: '',
  manual: null,
  result: null,        // {kind: 'end' | 'history', courtIndex?, no?, selected: []}
  backup: null,
  historyFilter: '',
  historyExpanded: false,
  resetArmed: false,
  deleteArmedNo: null,
  clearHistoryArmed: false,
  storageFailed: false,
};

/* ===================== 儲存層（localStorage） ===================== */
let storageEnabled = detectStorage();

// 無痕模式或瀏覽器封鎖時，localStorage 可能存在但寫入會拋錯，需實際測試
function detectStorage() {
  try {
    const testKey = `${STORAGE_KEYS.session}-test`;
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    return true;
  } catch (err) {
    return false;
  }
}

function storageGet(key) {
  if (!storageEnabled) return null;
  try {
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (err) {
    console.warn(`讀取失敗，略過 ${key}:`, err);
    return null;
  }
}

function storageSet(key, value) {
  if (!storageEnabled) return false;
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (err) {
    // 多半是容量已滿（QuotaExceededError）
    console.warn('儲存失敗:', err);
    storageEnabled = false;
    ui.storageFailed = true;
    render();
    return false;
  }
}

function loadAll() {
  ui.storageFailed = !storageEnabled;
  const session = storageGet(STORAGE_KEYS.session);
  if (session) state = normalizeState(session);
  const savedRegulars = storageGet(STORAGE_KEYS.regulars);
  if (Array.isArray(savedRegulars)) regulars = savedRegulars;
  const savedPrefs = storageGet(STORAGE_KEYS.prefs);
  if (savedPrefs && typeof savedPrefs === 'object') prefs = Object.assign(prefs, savedPrefs);
  applyCourtTheme();
  applyAppearance();
  // 向瀏覽器申請持久儲存，降低資料被自動清除的機率（不支援時略過）
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
}

const pendingSaves = {};
let saveTimer = null;

function flushSaves() {
  clearTimeout(saveTimer);
  Object.keys(pendingSaves).forEach((key) => {
    storageSet(key, pendingSaves[key]());
    delete pendingSaves[key];
  });
}

function scheduleSave(key, getter) {
  pendingSaves[key] = getter;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSaves, 300);
}

function saveSession() {
  scheduleSave(STORAGE_KEYS.session, () => state);
}

function savePrefs() {
  scheduleSave(STORAGE_KEYS.prefs, () => prefs);
}

const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

function applyAppearance() {
  const mode = APPEARANCE_LABEL[prefs.appearance] ? prefs.appearance : 'light';
  const dark = mode === 'dark' || (mode === 'auto' && darkQuery && darkQuery.matches);
  document.documentElement.setAttribute('data-appearance', dark ? 'dark' : 'light');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#111713' : '#E9EEE6');
}

// 「跟隨系統」時，手機切換深淺色會即時套用
if (darkQuery && darkQuery.addEventListener) {
  darkQuery.addEventListener('change', () => { if (prefs.appearance === 'auto') applyAppearance(); });
}

function applyCourtTheme() {
  const theme = COURT_THEMES[prefs.courtTheme] ? prefs.courtTheme : 'green';
  document.documentElement.setAttribute('data-court-theme', theme);
}

function saveRegulars() {
  scheduleSave(STORAGE_KEYS.regulars, () => regulars);
}

// 手機切換 app 或關閉頁面時，立即寫入尚未儲存的變更
window.addEventListener('pagehide', flushSaves);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSaves();
});

// 補齊舊版資料缺少的欄位，確保新舊版本的儲存資料都能直接使用
function normalizeState(raw) {
  const next = Object.assign(createDefaultState(), raw);
  next.players.forEach((p) => {
    p.benched = p.benched || 0;
    p.benchOffset = p.benchOffset || 0;
    p.lastStartSeq = p.lastStartSeq || 0;
  });
  next.startSeq = next.startSeq || 0;
  if (!FAIRNESS_STEP[next.fairness]) next.fairness = 'played';
  next.dayEnded = Boolean(next.dayEnded);
  return next;
}

function buildBackup() {
  return JSON.stringify({ version: BACKUP_VERSION, session: state, regulars });
}

function restoreBackup(text) {
  const data = JSON.parse(text);
  if (!data || data.version !== BACKUP_VERSION || !data.session || !Array.isArray(data.regulars)) {
    throw new Error('備份格式不正確');
  }
  state = normalizeState(data.session);
  regulars = data.regulars;
}

/* ===================== 工具函式 ===================== */
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function* combinations(items, size, start = 0, prefix = []) {
  if (prefix.length === size) {
    yield prefix.slice();
    return;
  }
  for (let i = start; i <= items.length - (size - prefix.length); i += 1) {
    prefix.push(items[i]);
    yield* combinations(items, size, i + 1, prefix);
    prefix.pop();
  }
}

function parseNames(text) {
  const names = text.split(/[\n,，、]+/).map((s) => s.trim()).filter(Boolean);
  return Array.from(new Set(names));
}

function formatTime(timestamp) {
  const d = new Date(timestamp);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function getPlayer(id) {
  return state.players.find((p) => p.id === id);
}

function playerName(id) {
  const p = getPlayer(id);
  return p ? p.name : '（已移除）';
}

/* ===================== 常用球員 ===================== */
function isRegular(name) {
  return regulars.includes(name);
}

function addRegulars(names) {
  names.forEach((name) => { if (!isRegular(name)) regulars.push(name); });
  saveRegulars();
}

function removeRegular(name) {
  regulars = regulars.filter((n) => n !== name);
  ui.setupSelected.delete(name);
  saveRegulars();
}

function toggleRegular(name) {
  if (isRegular(name)) removeRegular(name);
  else addRegulars([name]);
}

/* ===================== 權重核心 ===================== */
// 有效場數：實際場數 + 補償值（中途加入或休息回來時使用，避免被連續排場）
function effectivePlayed(player) {
  return player.played + player.offset;
}

// 有效累計等待：實際累計等待 + 補償值（與場數同理，中途加入者以平均值起算）
function effectiveBenched(player) {
  return player.benched + player.benchOffset;
}

function averageOf(getter, excludeId) {
  const pool = state.players.filter((p) => p.active && p.id !== excludeId);
  if (!pool.length) return 0;
  return Math.floor(pool.reduce((sum, p) => sum + getter(p), 0) / pool.length);
}

function averageEffective(excludeId) {
  return averageOf(effectivePlayed, excludeId);
}

function onCourtIds() {
  const ids = new Set();
  state.courts.forEach((court) => {
    if (court.match) court.match.teamA.concat(court.match.teamB).forEach((id) => ids.add(id));
  });
  return ids;
}

function availablePlayers() {
  const busy = onCourtIds();
  return state.players.filter((p) => p.active && !busy.has(p.id));
}

/**
 * 優先級（越小越優先）= 有效場數 − 累計等待補償
 * 累計等待每比在場平均多 step 場（依公平偏好），就視同少打一場。
 * 只補償等得多的人，等得少的人不扣分，避免場數被拉開太多。
 */
function priorityLevel(player) {
  const extraBench = effectiveBenched(player) - averageOf(effectiveBenched, null);
  const step = FAIRNESS_STEP[state.fairness] || FAIRNESS_STEP.balanced;
  return effectivePlayed(player) - Math.max(0, Math.floor(extraBench / step));
}

function comparePriority(a, b) {
  return priorityLevel(a) - priorityLevel(b)
    || b.wait - a.wait
    || effectiveBenched(b) - effectiveBenched(a);
}

// 排場用：同優先級隨機，避免每次都是同一批人
function rankPlayers(players) {
  return shuffle(players).sort(comparePriority);
}

// 畫面顯示用：同優先級依加入順序，重畫時順序不會跳動
function rankPlayersStable(players) {
  return players.slice().sort((a, b) => comparePriority(a, b) || a.id - b.id);
}

function pairKey(a, b) {
  return a < b ? `${a}|${b}` : `${b}|${a}`;
}

function pairStat(a, b) {
  return state.pairs[pairKey(a, b)] || { partner: 0, opponent: 0 };
}

function withinPairs(team) {
  const result = [];
  for (let i = 0; i < team.length; i += 1) {
    for (let j = i + 1; j < team.length; j += 1) result.push([team[i], team[j]]);
  }
  return result;
}

function crossPairs(teamA, teamB) {
  const result = [];
  teamA.forEach((a) => teamB.forEach((b) => result.push([a, b])));
  return result;
}

/**
 * 近期比賽的重複程度，由歷史紀錄與場上比賽即時推算，
 * 因此刪除紀錄後會自動更新，不需要另外回退。
 * 觀察範圍為最近「場地數 × 2」場（約兩輪），越近期權重越高（1 → 接近 0）。
 */
let recencyCache = { key: null, value: null };

function groupKey(ids) {
  return ids.slice().sort((a, b) => a - b).join(',');
}

function recentMatches() {
  const onCourt = state.courts
    .filter((court) => court.match)
    .map((court) => ({ seq: court.match.seq || 0, teamA: court.match.teamA, teamB: court.match.teamB }));
  const past = state.history.slice(0, state.courts.length * 2).map((entry) => ({
    seq: entry.seq || 0,
    teamA: resolveTeam(entry, 'A'),
    teamB: resolveTeam(entry, 'B'),
  }));
  return onCourt.concat(past).sort((a, b) => b.seq - a.seq);
}

function getRecency() {
  const newest = state.history[0];
  const key = `${state.startSeq}|${state.history.length}|${newest ? newest.no : 0}`;
  if (recencyCache.key === key) return recencyCache.value;

  const windowSize = state.courts.length * 2;
  const value = { group: {}, partner: {}, opponent: {}, together: {} };
  const keep = (map, k, w) => { map[k] = Math.max(map[k] || 0, w); };
  recentMatches().slice(0, windowSize).forEach((match, index) => {
    const weight = (windowSize - index) / windowSize;
    keep(value.group, groupKey(match.teamA.concat(match.teamB)), weight);
    withinPairs(match.teamA).concat(withinPairs(match.teamB))
      .forEach(([a, b]) => keep(value.partner, pairKey(a, b), weight));
    crossPairs(match.teamA, match.teamB)
      .forEach(([a, b]) => keep(value.opponent, pairKey(a, b), weight));
    withinPairs(match.teamA.concat(match.teamB))
      .forEach(([a, b]) => keep(value.together, pairKey(a, b), weight));
  });
  recencyCache = { key, value };
  return value;
}

function recencyPenalty(teamA, teamB) {
  const recency = getRecency();
  let penalty = RECENT_GROUP_WEIGHT * (recency.group[groupKey(teamA.concat(teamB))] || 0);
  withinPairs(teamA).concat(withinPairs(teamB)).forEach(([a, b]) => {
    penalty += RECENT_PARTNER_WEIGHT * (recency.partner[pairKey(a, b)] || 0);
  });
  crossPairs(teamA, teamB).forEach(([a, b]) => {
    penalty += RECENT_OPPONENT_WEIGHT * (recency.opponent[pairKey(a, b)] || 0);
  });
  // 同場重疊：新組合中任兩人近期同場過就扣分。3 人相同 = 3 對、2 人相同 = 1 對
  withinPairs(teamA.concat(teamB)).forEach(([a, b]) => {
    penalty += RECENT_TOGETHER_WEIGHT * (recency.together[pairKey(a, b)] || 0);
  });
  return penalty;
}

/* 今晚每一批 4 人（或單打 2 人）出現過幾次，由紀錄與場上比賽推算 */
let groupCountCache = { key: null, value: null };

function groupCounts() {
  const newest = state.history[0];
  const key = `${state.startSeq}|${state.history.length}|${newest ? newest.no : 0}`;
  if (groupCountCache.key === key) return groupCountCache.value;
  const value = {};
  const add = (ids) => { const k = groupKey(ids); value[k] = (value[k] || 0) + 1; };
  state.history.forEach((entry) => add(resolveTeam(entry, 'A').concat(resolveTeam(entry, 'B'))));
  state.courts.forEach((court) => { if (court.match) add(court.match.teamA.concat(court.match.teamB)); });
  groupCountCache = { key, value };
  return value;
}

function matchPenalty(teamA, teamB) {
  let penalty = recencyPenalty(teamA, teamB);
  penalty += GROUP_COUNT_WEIGHT * (groupCounts()[groupKey(teamA.concat(teamB))] || 0);
  withinPairs(teamA).concat(withinPairs(teamB)).forEach(([a, b]) => {
    const times = pairStat(a, b).partner;
    penalty += PARTNER_WEIGHT * times * times;
  });
  crossPairs(teamA, teamB).forEach(([a, b]) => {
    penalty += OPPONENT_WEIGHT * pairStat(a, b).opponent;
  });
  return penalty;
}

function bestSplit(ids) {
  let options;
  if (ids.length === 2) {
    options = [[[ids[0]], [ids[1]]]];
  } else if (ids.length === 4) {
    const [a, b, c, d] = ids;
    options = shuffle([[[a, b], [c, d]], [[a, c], [b, d]], [[a, d], [b, c]]]);
  } else {
    throw new Error(`無法分隊：人數 ${ids.length}`);
  }
  let best = null;
  options.forEach(([teamA, teamB]) => {
    const penalty = matchPenalty(teamA, teamB);
    if (!best || penalty < best.penalty) best = { teamA, teamB, penalty };
  });
  return best;
}

/**
 * 連等上限：在「場數最平均」的理想輪轉下，最長會等幾場新比賽。
 * 場下人數 bench，每場帶走 needTotal 人，約需 ceil(bench / needTotal) 場才輪完，
 * 再加 1 是因為剛下場的人也會一起進入候選。
 * 例：2 場雙打 12 人 → 2；18 人 → 4；24 人 → 5。
 */
function waitLimit(needTotal) {
  const activeCount = state.players.filter((p) => p.active).length;
  const bench = Math.max(0, activeCount - state.courts.length * needTotal);
  return Math.ceil(bench / needTotal) + 1;
}

/**
 * 選人邏輯：
 * 0. 連等達上限的人強制上場（overdue）：不論場數，避免有人被卡在場下
 * 1. 候選人 = 優先級不超過「理想名單最後一人 + 1 級」的人
 *    優先級 = 場數，累計等待偏多者會提前（見 priorityLevel）
 * 2. 窮舉候選人組合，分數取最低：
 *      重複配對懲罰（整晚累計 + 近期重複）
 *    + 放寬成本     × 偏離理想名單的級數   （公平性成本：只有能明顯避開重複時才值得）
 *    − WAIT_WEIGHT  × Σ 連續等待²
 *    − BENCH_WEIGHT × Σ 相對累計等待
 *    放寬一級的成本（20）低於「同一批 4 人剛打過」的懲罰（最高 24），
 *    所以系統會為了避開剛出現過的組合，最多讓公平性讓一小步。
 */
function pickMatch(needTotal) {
  const ranked = rankPlayers(availablePlayers());
  if (ranked.length < needTotal) return null;

  const limit = waitLimit(needTotal);
  const overdue = ranked
    .filter((p) => p.wait >= limit)
    .sort((a, b) => b.wait - a.wait || comparePriority(a, b))
    .slice(0, needTotal);
  const rest = ranked.filter((p) => !overdue.includes(p));
  const openSlots = needTotal - overdue.length;

  if (openSlots === 0) return bestSplit(overdue.map((p) => p.id));

  const boundary = priorityLevel(rest[openSlots - 1]);
  const candidates = rest.filter((p) => priorityLevel(p) <= boundary + 1).slice(0, CANDIDATE_LIMIT);
  const idealLevel = rest.slice(0, openSlots).reduce((sum, p) => sum + priorityLevel(p), 0);
  const minBenched = Math.min(...candidates.map(effectiveBenched));

  let best = null;
  for (const combo of combinations(candidates, openSlots)) {
    const chosen = overdue.concat(combo);
    const split = bestSplit(chosen.map((p) => p.id));
    const levelCost = (LEVEL_COST_BY_FAIRNESS[state.fairness] || 20) * (combo.reduce((sum, p) => sum + priorityLevel(p), 0) - idealLevel);
    const waitScore = combo.reduce((sum, p) => sum + p.wait * p.wait, 0);
    const benchScore = combo.reduce((sum, p) => sum + effectiveBenched(p) - minBenched, 0);
    const score = split.penalty + levelCost - WAIT_WEIGHT * waitScore - BENCH_WEIGHT * benchScore;
    if (!best || score < best.score) best = Object.assign({ score }, split);
  }
  return best;
}

function updatePairs(teamA, teamB, delta) {
  const bump = (a, b, field) => {
    const key = pairKey(a, b);
    const stat = state.pairs[key] || { partner: 0, opponent: 0 };
    stat[field] = Math.max(0, stat[field] + delta);
    state.pairs[key] = stat;
  };
  withinPairs(teamA).concat(withinPairs(teamB)).forEach(([a, b]) => bump(a, b, 'partner'));
  crossPairs(teamA, teamB).forEach(([a, b]) => bump(a, b, 'opponent'));
}

/* 開場即寫入權重（自動與手動共用），讓其他場地的排場能即時參考 */
/**
 * @param {boolean} countWait 是否替場下的人累加等待；開局第一輪為 false，
 *        因為還沒有人真正「被跳過」，只是還沒輪到。
 */
function commitMatch(courtIndex, teamA, teamB, isManual, countWait = true) {
  state.dayEnded = false;
  const ids = teamA.concat(teamB);
  const idle = countWait ? availablePlayers().filter((p) => !ids.includes(p.id)) : [];
  const prevWait = {};
  const prevLastStart = {};
  state.startSeq += 1;
  const seq = state.startSeq;

  ids.forEach((id) => {
    const p = getPlayer(id);
    prevWait[id] = p.wait;
    prevLastStart[id] = p.lastStartSeq;
    p.played += 1;
    p.wait = 0;
    p.lastStartSeq = seq;
  });
  idle.forEach((p) => {
    p.wait += 1;
    p.benched += 1;
  });
  updatePairs(teamA, teamB, 1);

  state.courts[courtIndex].match = {
    teamA, teamB, isManual, prevWait, prevLastStart, seq,
    mode: state.mode,
    idleIds: idle.map((p) => p.id),
    startedAt: Date.now(),
  };
}

/**
 * 回退一場比賽對等待的影響（取消場地、刪除紀錄共用）。
 *
 * 上場者：若這場之後沒再上場（lastStartSeq 仍是這場），代表他其實一路在等，
 *         連等 = 上場前的連等 + 之後又累積的連等，並還原上一次上場的流水號。
 * 場下者：累計等待 -1；若這場之後都沒上場過（連等沒被中斷），連等也 -1。
 * 舊版紀錄沒有流水號與場下名單，無法判斷，只回退能確定的部分。
 */
function revertWaits(record, participantIds) {
  const busy = onCourtIds();
  const hasSeq = typeof record.seq === 'number';

  participantIds.forEach((id) => {
    const p = getPlayer(id);
    if (!p || !hasSeq || p.lastStartSeq !== record.seq) return;
    if (busy.has(id) && !record.isOnCourt) return;
    p.wait = (record.prevWait[id] || 0) + (record.isOnCourt ? 0 : p.wait);
    p.lastStartSeq = record.prevLastStart[id] || 0;
  });

  (record.idleIds || []).forEach((id) => {
    const p = getPlayer(id);
    if (!p) return;
    p.benched = Math.max(0, p.benched - 1);
    const streakUnbroken = hasSeq && p.lastStartSeq < record.seq && !busy.has(id);
    if (streakUnbroken) p.wait = Math.max(0, p.wait - 1);
  });
}

function cancelMatch(courtIndex) {
  const match = state.courts[courtIndex].match;
  if (!match) return;
  const ids = match.teamA.concat(match.teamB).filter((id) => getPlayer(id));
  ids.forEach((id) => {
    const p = getPlayer(id);
    p.played = Math.max(0, p.played - 1);
  });
  updatePairs(match.teamA, match.teamB, -1);
  state.courts[courtIndex].match = null;
  // 比賽剛被取消，上場者此刻的連等就是上場前的值
  revertWaits(Object.assign({ isOnCourt: true }, match), ids);
}

function sameMembers(a, b) {
  return a.length === b.length && a.every((id) => b.includes(id));
}

/**
 * 寫入或清除一筆紀錄的勝方。
 * 以「實際勝出的人」為準：若勝方不等於排定的任一隊（中途換過隊友），
 * 代表實際分隊不同，會一併修正紀錄中的隊伍與配對統計，讓之後避免重複組合時依據正確。
 * @param {number[]|null} winnerIds 勝方球員 id；null 表示清除勝負
 */
function applyResult(entry, winnerIds) {
  if (!entry.teamAIds || !entry.teamBIds) return false;   // 舊版紀錄沒有 id，無法記錄
  if (!winnerIds) {
    delete entry.winnerIds;
    delete entry.winners;
    return true;
  }
  const nameOf = {};
  entry.teamAIds.forEach((id, i) => { nameOf[id] = entry.teamA[i]; });
  entry.teamBIds.forEach((id, i) => { nameOf[id] = entry.teamB[i]; });
  const all = entry.teamAIds.concat(entry.teamBIds);
  const winners = winnerIds.filter((id) => all.includes(id));
  const losers = all.filter((id) => !winners.includes(id));
  if (winners.length !== losers.length) return false;

  if (!sameMembers(winners, entry.teamAIds) && !sameMembers(winners, entry.teamBIds)) {
    updatePairs(entry.teamAIds, entry.teamBIds, -1);
    updatePairs(winners, losers, 1);
    entry.teamAIds = winners.slice();
    entry.teamBIds = losers.slice();
    entry.teamA = winners.map((id) => nameOf[id]);
    entry.teamB = losers.map((id) => nameOf[id]);
    entry.swapped = true;
  }
  entry.winnerIds = winners.slice();
  entry.winners = winners.map((id) => nameOf[id]);
  return true;
}

/**
 * 顯示用的場次編號：依目前剩下的紀錄由舊到新重新編號（1、2、3…）。
 * h.no 是內部識別碼，刪除後不重複使用，只用來對應按鈕與紀錄，不顯示給使用者。
 */
function displayNo(entry) {
  return state.history.length - state.history.indexOf(entry);
}

/* ===================== 賽前勝率預測 =====================
 * 只用「這場開打前已經結束、且有記勝負」的紀錄，避免用未來的結果預測過去。
 * 個人實力 = (勝 + 2) / (場 + 4)：資料少時接近 50%，打越多越貼近實際勝率。
 * 隊伍實力取平均，勝率以 logistic 換算；實力差 0.1 約等於 62% 對 38%。 */
const PREDICT_K = 5;
const UPSET_LINE = 0.4;   // 勝方賽前預測勝率不超過 40% 即為爆冷

function playerRecordBefore(name, time) {
  let wins = 0;
  let games = 0;
  state.history.forEach((h) => {
    if (!h.winners || !h.endedAt || h.endedAt > time) return;
    if (!h.teamA.includes(name) && !h.teamB.includes(name)) return;
    games += 1;
    if (h.winners.includes(name)) wins += 1;
  });
  return { wins, games };
}

function predictMatch(namesA, namesB, time) {
  const strength = (names) => {
    let total = 0;
    let games = 0;
    names.forEach((n) => {
      const r = playerRecordBefore(n, time);
      total += (r.wins + 2) / (r.games + 4);
      games += r.games;
    });
    return { value: total / names.length, games };
  };
  const a = strength(namesA);
  const b = strength(namesB);
  const pA = 1 / (1 + Math.exp(-PREDICT_K * (a.value - b.value) * 2));
  return { pA, pB: 1 - pA, enough: a.games + b.games >= 3 };
}

// 一筆紀錄的賽前預測與是否爆冷
function matchPrediction(h) {
  const time = h.clockStart || h.startedAt;
  const pred = predictMatch(h.teamA, h.teamB, time);
  if (!h.winners || !pred.enough) return { pred, upset: false, winnerP: null };
  const aWon = h.winners.every((n) => h.teamA.includes(n));
  const winnerP = aWon ? pred.pA : pred.pB;
  return { pred, upset: winnerP <= UPSET_LINE, winnerP };
}

/* 今日戰績：只由歷史紀錄推算，刪除紀錄或開新球局會自動更新 */
function todayStats() {
  const stats = {};
  state.history.forEach((entry) => {
    if (!entry.winners) return;
    entry.teamA.concat(entry.teamB).forEach((name) => {
      const row = stats[name] || (stats[name] = { name, wins: 0, games: 0 });
      row.games += 1;
      if (entry.winners.includes(name)) row.wins += 1;
    });
  });
  return Object.values(stats).sort((a, b) =>
    b.wins / b.games - a.wins / a.games || b.wins - a.wins || b.games - a.games);
}

/**
 * 場上交換兩位球員的位置（中途換隊友）。
 * 兩人不同隊時，隊伍組成改變：先扣回舊分隊的配對統計，再加上新分隊，
 * 之後結束比賽、避免重複組合都會以實際分隊為準。同隊交換只改顯示順序。
 */
function swapOnCourt(courtIndex, idA, idB) {
  const match = state.courts[courtIndex] && state.courts[courtIndex].match;
  if (!match || idA === idB) return false;
  const locate = (id) => (match.teamA.includes(id) ? match.teamA : match.teamB.includes(id) ? match.teamB : null);
  const teamOfA = locate(idA);
  const teamOfB = locate(idB);
  if (!teamOfA || !teamOfB) return false;

  if (teamOfA === teamOfB) {
    const i = teamOfA.indexOf(idA);
    const j = teamOfA.indexOf(idB);
    [teamOfA[i], teamOfA[j]] = [teamOfA[j], teamOfA[i]];
    return true;
  }
  updatePairs(match.teamA, match.teamB, -1);
  teamOfA[teamOfA.indexOf(idA)] = idB;
  teamOfB[teamOfB.indexOf(idB)] = idA;
  updatePairs(match.teamA, match.teamB, 1);
  return true;
}

/**
 * 場下球員換上場：outId 下場、inId 上場，接手相同位置。
 * 視為「改為手動」的換人：沿用原本的開局時間與計時，不算新開一局。
 * 場數、等待、配對以取消原組合後重新開場的方式結算，和手動換人一致。
 */
function substituteOnCourt(courtIndex, outId, inId) {
  const match = state.courts[courtIndex] && state.courts[courtIndex].match;
  if (!match || isPaused(match) || outId === inId) return false;
  if (!availablePlayers().some((p) => p.id === inId)) return false;
  const swapIn = (team) => team.map((pid) => (pid === outId ? inId : pid));
  const teamA = swapIn(match.teamA);
  const teamB = swapIn(match.teamB);
  if (teamA.join() === match.teamA.join() && teamB.join() === match.teamB.join()) return false;

  const now = Date.now();
  const keep = {
    openedAt: openedAtOf(match),
    clockStart: match.clockStart || match.startedAt,
    carriedPausedMs: (match.carriedPausedMs || 0) + pausedMs(match, now),
    isManual: true,
  };
  cancelMatch(courtIndex);
  commitMatch(courtIndex, teamA, teamB, true);
  Object.assign(state.courts[courtIndex].match, keep);
  ui.pendingWin = null;
  return true;
}

/**
 * 兩個場地的球員互換：a 從 courtA 換到 courtB，b 從 courtB 換到 courtA，各自接手對方的位置。
 * 兩人都仍在場上，所以場數、等待都不變，只調整：
 * - 兩場的配對統計（先扣回舊分隊，再加上新分隊）
 * - 回退等待用的紀錄：上場前的等待、上一次上場的流水號，跟著人一起搬到新的場次
 * 兩個場地的計時與開局時間都保留，不算新開局；暫停中的場地不能互換。
 */
function swapAcrossCourts(courtA, a, courtB, b) {
  const mA = state.courts[courtA] && state.courts[courtA].match;
  const mB = state.courts[courtB] && state.courts[courtB].match;
  if (!mA || !mB || courtA === courtB || isPaused(mA) || isPaused(mB)) return false;
  const inA = mA.teamA.includes(a) || mA.teamB.includes(a);
  const inB = mB.teamA.includes(b) || mB.teamB.includes(b);
  if (!inA || !inB) return false;

  updatePairs(mA.teamA, mA.teamB, -1);
  updatePairs(mB.teamA, mB.teamB, -1);
  const put = (team, from, to) => team.map((id) => (id === from ? to : id));
  mA.teamA = put(mA.teamA, a, b); mA.teamB = put(mA.teamB, a, b);
  mB.teamA = put(mB.teamA, b, a); mB.teamB = put(mB.teamB, b, a);
  updatePairs(mA.teamA, mA.teamB, 1);
  updatePairs(mB.teamA, mB.teamB, 1);

  // 回退資料跟著人走
  [[a, mA, mB], [b, mB, mA]].forEach(([id, from, to]) => {
    to.prevWait = to.prevWait || {};
    to.prevLastStart = to.prevLastStart || {};
    to.prevWait[id] = from.prevWait ? from.prevWait[id] : 0;
    to.prevLastStart[id] = from.prevLastStart ? from.prevLastStart[id] : 0;
    if (from.prevWait) delete from.prevWait[id];
    if (from.prevLastStart) delete from.prevLastStart[id];
    const p = getPlayer(id);
    if (p && p.lastStartSeq === from.seq) p.lastStartSeq = to.seq;
  });
  mA.isManual = true;
  mB.isManual = true;
  if (ui.pendingWin && (ui.pendingWin.court === courtA || ui.pendingWin.court === courtB)) ui.pendingWin = null;
  return true;
}

function recordHistory(courtIndex, match, winnerIds = null) {
  state.finishedCount += 1;
  state.history.unshift({
    no: state.finishedCount,
    court: courtIndex + 1,
    mode: match.mode || state.mode,
    isManual: match.isManual,
    teamA: match.teamA.map(playerName),   // 存名字，球員移除後仍可閱讀
    teamB: match.teamB.map(playerName),
    teamAIds: match.teamA.slice(),        // 存 id，刪除紀錄時用來回退權重
    teamBIds: match.teamB.slice(),
    seq: match.seq,                       // 以下供刪除紀錄時回退等待使用
    prevWait: match.prevWait,
    prevLastStart: match.prevLastStart,
    idleIds: match.idleIds,
    startedAt: match.startedAt,
    openedAt: openedAtOf(match),
    pauses: (match.pauses || []).map(([ps, pe]) => [ps, pe === null ? Date.now() : pe]),
    clockStart: match.clockStart || match.startedAt,
    carriedPausedMs: match.carriedPausedMs || 0,
    endedAt: Date.now(),
  });
  if (winnerIds) applyResult(state.history[0], winnerIds);
  if (state.history.length > HISTORY_LIMIT) state.history.length = HISTORY_LIMIT;
}

/**
 * 取得紀錄中某一隊的球員 id。
 * 新紀錄直接存 id；舊紀錄只有名字，同一局內名字唯一，可用名字對回球員。
 */
function resolveTeam(entry, side) {
  const ids = entry[`team${side}Ids`];
  if (ids) return ids.filter((id) => getPlayer(id));
  return entry[`team${side}`]
    .map((name) => state.players.find((p) => p.name === name))
    .filter(Boolean)
    .map((p) => p.id);
}

/**
 * 刪除一筆已完成的紀錄，並回退它對權重的影響（場數、配對、連等、累計等待）。
 */
function deleteHistory(matchNo) {
  const index = state.history.findIndex((h) => h.no === matchNo);
  if (index < 0) return false;
  const entry = state.history[index];
  const teamA = resolveTeam(entry, 'A');
  const teamB = resolveTeam(entry, 'B');
  teamA.concat(teamB).forEach((id) => {
    const p = getPlayer(id);
    p.played = Math.max(0, p.played - 1);
  });
  updatePairs(teamA, teamB, -1);
  revertWaits(entry, teamA.concat(teamB));
  state.history.splice(index, 1);
  return true;
}

/**
 * 刪除全部歷史紀錄，逐筆回退場數、配對與等待。
 * 必須由新到舊刪除：回退連等時需要還原「上一次上場的流水號」，順序反了會判斷錯誤。
 * 場上進行中的比賽與球員名單不受影響。
 */
function deleteAllHistory() {
  const count = state.history.length;
  state.history.map((h) => h.no).forEach((no) => deleteHistory(no));
  ui.historyFilter = '';
  ui.historyExpanded = false;
  return count;
}

/* 以「歷史紀錄 + 場上進行中的比賽」為唯一依據，推算每人應有的場數 */
function expectedPlayed() {
  const counts = {};
  state.players.forEach((p) => { counts[p.id] = 0; });
  const add = (id) => { if (id in counts) counts[id] += 1; };
  state.history.forEach((entry) => {
    resolveTeam(entry, 'A').concat(resolveTeam(entry, 'B')).forEach(add);
  });
  state.courts.forEach((court) => {
    if (court.match) court.match.teamA.concat(court.match.teamB).forEach(add);
  });
  return counts;
}

function isPlayedConsistent() {
  const expected = expectedPlayed();
  return state.players.every((p) => p.played === expected[p.id]);
}

/* 依歷史紀錄重建場數與配對；補償值（offset）與等待輪數維持不變 */
function rebuildFromHistory() {
  const expected = expectedPlayed();
  state.players.forEach((p) => { p.played = expected[p.id]; });
  state.pairs = {};
  state.history.forEach((entry) => {
    updatePairs(resolveTeam(entry, 'A'), resolveTeam(entry, 'B'), 1);
  });
  state.courts.forEach((court) => {
    if (court.match) updatePairs(court.match.teamA, court.match.teamB, 1);
  });
}

function fillCourt(courtIndex, countWait = true) {
  const needTotal = TEAM_SIZE[state.mode] * 2;
  const match = pickMatch(needTotal);
  if (!match) {
    showToast(`可上場人數不足，${MODE_LABEL[state.mode]}需要 ${needTotal} 人`);
    return false;
  }
  commitMatch(courtIndex, match.teamA, match.teamB, false, countWait);
  return true;
}

function fillAllEmpty() {
  const isOpening = state.startSeq === 0;   // 整局還沒開過任何一場
  for (let i = 0; i < state.courts.length; i += 1) {
    if (!state.courts[i].match && !fillCourt(i, !isOpening)) break;
  }
}

function endMatch(courtIndex, winnerIds = null) {
  const match = state.courts[courtIndex].match;
  if (!match) return;
  recordHistory(courtIndex, match, winnerIds);
  state.courts[courtIndex].match = null;
  if (state.autoFill) fillCourt(courtIndex);
}

/* ===================== 球員管理 ===================== */
function addPlayers(names) {
  const existing = new Set(state.players.map((p) => p.name));
  const baseline = averageEffective(null);
  const benchBaseline = averageOf(effectiveBenched, null);
  let added = 0;
  names.forEach((name) => {
    if (existing.has(name)) return;
    state.players.push({
      id: state.nextId++, name, played: 0,
      offset: state.players.length ? baseline : 0,
      benched: 0,
      lastStartSeq: 0,
      benchOffset: state.players.length ? benchBaseline : 0,
      wait: 0, active: true,
    });
    existing.add(name);
    added += 1;
  });
  return added;
}

function toggleActive(id) {
  const p = getPlayer(id);
  if (!p) return;
  if (p.active) {
    p.active = false;
    return;
  }
  const avg = averageEffective(id);
  p.offset += Math.max(0, avg - effectivePlayed(p));
  p.benchOffset += Math.max(0, averageOf(effectiveBenched, id) - effectiveBenched(p));
  p.wait = 0;
  p.active = true;
}

function removePlayer(id) {
  if (onCourtIds().has(id)) {
    showToast('場上的球員需先結束或取消該場');
    return;
  }
  state.players = state.players.filter((p) => p.id !== id);
}

function setCourtCount(count) {
  const target = Math.max(1, Math.min(MAX_COURTS, count));
  while (state.courts.length < target) state.courts.push({ match: null });
  if (state.courts.length > target) {
    if (state.courts.slice(target).some((c) => c.match)) {
      showToast('要減少的場地還在比賽，請先結束');
      return;
    }
    state.courts = state.courts.slice(0, target);
  }
}

/* ===================== 畫面：排場中 ===================== */
/**
 * 這場開打後，其他場地已經開了幾場新比賽。
 * 數量明顯偏多時，多半是這個場地忘了按「結束」。
 */
/**
 * 這場之後，又有幾場「新開的局」（紀錄 + 場上，不含自己）。
 * 以 openedAt（開局時間）比較：
 * - 「改為手動」只是換人，沿用原本的開局時間，不算新開一局
 * - 「取消」的比賽不在紀錄裡，也不會被算進去
 */
function openedAtOf(m) {
  return m.openedAt || m.startedAt || 0;
}

function matchesStartedSince(match) {
  const since = openedAtOf(match);
  const ranges = pauseRanges(match);
  const counts = (t) => t > since && !ranges.some(([s, e]) => t >= s && t <= e);
  let count = state.history.filter((h) => counts(openedAtOf(h))).length;
  state.courts.forEach((court) => {
    if (court.match && court.match !== match && counts(openedAtOf(court.match))) count += 1;
  });
  return count;
}

function staleThreshold() {
  return Math.max(3, 3 * (state.courts.length - 1));
}

/* ===== 單一場地暫停 =====
 * match.pauses = [[開始, 結束 | null], ...]；最後一筆結束為 null 表示暫停中。
 * 暫停期間：不計入「已打 N 分」、場上球員視同休息（回血）、
 * 其他場地在這段時間開的局，也不算進「忘了按結束」的提醒。 */
function isPaused(match) {
  const last = match && match.pauses && match.pauses[match.pauses.length - 1];
  return Boolean(last && last[1] === null);
}

function pauseRanges(match, until = Date.now()) {
  return (match.pauses || []).map(([s, e]) => [s, e === null ? until : e]);
}

function pausedMs(match, until = Date.now()) {
  return pauseRanges(match, until).reduce((sum, [s, e]) => sum + Math.max(0, Math.min(e, until) - s), 0);
}

// 實際比賽時間（扣除暫停），單位分鐘
// 計時起點：「改為手動」換人時沿用原本那場的起點與已暫停時間，計時接續不歸零
function playedMinutes(match, until = Date.now()) {
  const end = match.endedAt || until;
  const start = match.clockStart || match.startedAt;
  const paused = pausedMs(match, end) + (match.carriedPausedMs || 0);
  return Math.max(0, Math.floor((end - start - paused) / 60000));
}

// 把一場比賽切成「實際在打」的時段，扣掉暫停區間
function activeSegments(start, end, pauses) {
  const segments = [];
  let cursor = start;
  pauses.slice().sort((a, b) => a[0] - b[0]).forEach(([ps, pe]) => {
    if (pe <= cursor || ps >= end) return;
    if (ps > cursor) segments.push([cursor, Math.min(ps, end)]);
    cursor = Math.max(cursor, pe);
  });
  if (cursor < end) segments.push([cursor, end]);
  return segments;
}

function elapsedMinutes(startedAt) {
  return Math.max(0, Math.floor((Date.now() - startedAt) / 60000));
}

/**
 * 依國際規格畫出雙打球場（單位：公尺）。
 * 長 13.4、寬 6.1；單打邊線內縮 0.46；前發球線距網 1.98；雙打後發球線距底線 0.76。
 */
function courtLinesSvg() {
  const L = 13.4;
  const W = 6.1;
  const net = L / 2;
  const shortA = net - 1.98;
  const shortB = net + 1.98;
  const line = (x1, y1, x2, y2, extra = '') =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="1.5" ${extra}/>`;
  return `<svg viewBox="0 0 ${L} ${W}" preserveAspectRatio="none" aria-hidden="true">
    <rect x="0" y="0" width="${L}" height="${W}" stroke-width="2"/>
    ${line(0, 0.46, L, 0.46)}${line(0, W - 0.46, L, W - 0.46)}
    ${line(shortA, 0, shortA, W)}${line(shortB, 0, shortB, W)}
    ${line(0.76, 0, 0.76, W)}${line(L - 0.76, 0, L - 0.76, W)}
    ${line(0, W / 2, shortA, W / 2)}${line(shortB, W / 2, L, W / 2)}
    ${line(net, -0.35, net, W + 0.35, 'class="net" stroke-width="3.5"')}
  </svg>`;
}

function renderPredictBar(match) {
  const time = match.clockStart || match.startedAt;
  const pred = predictMatch(match.teamA.map(playerName), match.teamB.map(playerName), time);
  if (!pred.enough) return '<div class="predict muted">勝率預測：今天的勝負紀錄還不夠</div>';
  const a = Math.round(pred.pA * 100);
  return `<div class="predict" aria-label="勝率預測 左隊 ${a}%，右隊 ${100 - a}%">
    <span class="num">${a}%</span>
    <div class="predict-bar"><div style="width:${a}%"></div></div>
    <span class="num">${100 - a}%</span>
  </div>`;
}

function renderCourt(court, index) {
  const since = court.match ? matchesStartedSince(court.match) : 0;
  const alert = since >= staleThreshold()
    ? `<div class="court-alert" role="status">其他場地已開了 ${since} 場，這場是否忘了按結束？</div>`
    : '';
  const paused = isPaused(court.match);
  const meta = !court.match
    ? '空場'
    : paused
      ? `<button class="paused-tag" data-action="resume-court" data-court="${index}" aria-label="繼續第 ${index + 1} 場地的比賽">暫停中</button>`
      : `${court.match.isManual ? '手動' : '自動'}・已打 <span class="num" data-elapsed-court="${index}">${playedMinutes(court.match)}</span> 分
         <button class="pause-btn" data-action="pause-court" data-court="${index}" aria-label="暫停第 ${index + 1} 場地">暫停</button>`;
  const title = `<div class="court-head">
      <span class="court-name">第 ${index + 1} 場地</span>
      <span class="court-meta">${meta}</span>
    </div>${paused ? '' : alert}`;

  if (!court.match) {
    return `<div class="court">${title}
      <div class="court-map empty">${courtLinesSvg()}<span class="empty-label">等待排場</span></div>
      <div class="court-actions">
        <button class="btn-tape" data-action="fill-court" data-court="${index}">自動排</button>
        <button data-action="manual-open" data-court="${index}">手動排</button>
      </div></div>`;
  }

  const picked = ui.pendingWin && ui.pendingWin.court === index ? ui.pendingWin.team : null;
  const half = (team, side) => {
    const cls = picked === side ? 'picked' : (picked ? 'dimmed' : '');
    const names = team.map(playerName);
    // 暫停中：不能選勝方，也不能拖曳換位
    if (paused) {
      return `<div class="half side-${side} locked" aria-label="${escapeHtml(names.join('、'))}">
        ${team.map((id, i) => {
          const slot = team.length === 1 ? 'slot-only' : (i === 0 ? 'slot-top' : 'slot-bottom');
          return `<span class="drag-chip ${slot} no-drag"><span class="name-chip">${escapeHtml(playerName(id))}</span></span>`;
        }).join('')}
      </div>`;
    }
    return `<button class="half side-${side} ${cls}" data-action="win-select" data-court="${index}" data-team="${side}"
        aria-pressed="${picked === side}" aria-label="${escapeHtml(names.join('、'))}，點選設為勝方">
      ${picked === side ? '<span class="win-flag">勝</span>' : ''}
      ${team.map((id, i) => {
        const slot = team.length === 1 ? 'slot-only' : (i === 0 ? 'slot-top' : 'slot-bottom');
        return `<span class="drag-chip ${slot}" data-pid="${id}" data-court="${index}" data-name="${escapeHtml(playerName(id))}"><span class="name-chip">${escapeHtml(playerName(id))}</span></span>`;
      }).join('')}
    </button>`;
  };
  const predict = renderPredictBar(court.match);
  const lines = `${predict}<div class="court-map ${paused ? 'is-paused' : ''}">${courtLinesSvg()}${half(court.match.teamA, 'A')}${half(court.match.teamB, 'B')}</div>`;
  // 提示文字在選擇勝方前後都保留，避免版面高度改變而跳動
  const hint = paused
    ? '<p class="court-hint">暫停中無法記勝負或換位，繼續比賽後即可操作</p>'
    : '<p class="court-hint">長按名字拖曳換位（可跨場地）｜點勝隊半場記勝負｜按結束則不記</p>';

  if (picked) {
    const winners = (picked === 'A' ? court.match.teamA : court.match.teamB).map(playerName).join('、');
    return `<div class="court">${title}${lines}${hint}
      <div class="court-actions">
        <button class="btn-tape" data-action="win-confirm">確認：${escapeHtml(winners)} 勝，結束這場</button>
        <button class="btn-ghost" data-action="win-clear">取消</button>
      </div></div>`;
  }
  if (paused) {
    return `<div class="court">${title}${lines}${hint}
      <div class="court-actions">
        <button class="btn-tape" data-action="resume-court" data-court="${index}">▶ 繼續比賽</button>
        <button class="btn-court-alt" data-action="end-match" data-court="${index}">結束這場</button>
        <button class="btn-ghost" data-action="cancel-match" data-court="${index}">取消</button>
      </div></div>`;
  }
  return `<div class="court">${title}${lines}${hint}
    <div class="court-actions">
      <button class="btn-tape" data-action="end-match" data-court="${index}">結束這場</button>
      <button class="btn-ghost" data-action="cancel-match" data-court="${index}">取消</button>
    </div></div>`;
}

/**
 * 板凳區：場下等待的球員坐在木頭長椅上
 * - 下一場：優先上場的人，黃色坐墊
 * - 板凳區：其餘等待的人
 * - 休息區：按了「休息」的人，灰色、不可拖曳
 * 坐墊都可以長按拖到場上換人（沿用 bench-chip 的拖曳機制）
 */
function renderSeat(p, { next = false, limit = Infinity } = {}) {

  return `<span class="seat bench-chip ${next ? 'seat-next' : ''} ${must ? 'seat-must' : ''}"

}

function renderBenchRow(label, seats, extraClass = '') {
  return `<div class="bench-row ${extraClass}">
    <div class="bench-label">${label}</div>
    <div class="bench">
      <div class="bench-seats">${seats}</div>

      <div class="bench-legs" aria-hidden="true"><i></i><i></i></div>
    </div>
  </div>`;
}

function renderWaiting() {
  const needTotal = TEAM_SIZE[state.mode] * 2;
  const limit = waitLimit(needTotal);
  const ranked = rankPlayersStable(availablePlayers());
  const resting = state.players.filter((p) => !p.active);
  const nextUp = ranked.slice(0, needTotal);
  const others = ranked.slice(needTotal);

  let html = '';
  if (!ranked.length) {
    html += renderBenchRow('板凳區', '<span class="bench-empty">板凳是空的，大家都在場上</span>');
  } else {
    html += renderBenchRow(`下一場<small>${nextUp.length} 人</small>`,
      nextUp.map((p) => renderSeat(p, { next: true, limit })).join(''), 'row-next');
    if (others.length) {
      html += renderBenchRow(`板凳區<small>${others.length} 人</small>`,
        others.map((p) => renderSeat(p, { limit })).join(''), 'row-bench');
    }
  }
  if (resting.length) {
    html += renderBenchRow(`休息區<small>${resting.length} 人</small>`,
      resting.map((p) => `<span class="seat seat-rest"><b>${escapeHtml(p.name)}</b><small>休息中</small></span>`).join(''),
      'row-rest');
  }
  // 場邊卡片沿用 .court 的配色變數，跟著「場地配色」一起變化
  return `<div class="court sideline">
      <div class="court-head">
        <span class="court-name">場邊</span>
        <span class="court-meta">${ranked.length} 人等待${resting.length ? `・${resting.length} 人休息` : ''}</span>
      </div>
      <div class="sideline-floor">

function renderRegularQuickAdd() {

/**
 * 體力（只顯示，不影響排場）：由歷史紀錄與場上比賽的時間即時推算。
 * 每人從 100 開始；在場上每分鐘 −1.5，不在場上（等待或休息）每分鐘 +1，範圍 0～100。
 * 輸球的一方在比賽結束時再扣 5。例：打 20 分鐘輸球 −35；下場休息 10 分鐘 +10。
 */
const STAMINA_DRAIN = 1.5;
const STAMINA_RECOVER = 1;
const STAMINA_LOSS_PENALTY = 5;   // 輸球的一方下場時額外扣血（只計有記勝負的場次）

/**
 * 推算某位球員在 until 這個時間點的體力，以及第一次歸零的時間。
 * 只採計 until 之前開始的上場區間（進行中的比賽算到 until 為止），
 * 因此可以回推任一場比賽開打當下的體力，供稱號判斷使用。
 * @returns {{value: number, zeroAt: number|null}}
 */
function staminaTrack(player, until = Date.now()) {
  // 每場比賽：實際在打的時段（扣除暫停）＋是否輸球＋結束時間
  const matches = [];
  state.history.forEach((h) => {
    const ids = resolveTeam(h, 'A').concat(resolveTeam(h, 'B'));
    if (!ids.includes(player.id) || !h.startedAt || !h.endedAt) return;
    const lost = Boolean(h.winners) && !h.winners.includes(player.name);
    matches.push({ start: h.startedAt, end: h.endedAt, pauses: pauseRanges(h, h.endedAt), lost });
  });
  state.courts.forEach((court) => {
    const m = court.match;
    if (m && m.teamA.concat(m.teamB).includes(player.id)) {
      matches.push({ start: m.startedAt, end: Infinity, pauses: pauseRanges(m, until), lost: false });
    }
  });
  matches.sort((a, b) => a.start - b.start);

  const minutes = (ms) => Math.max(0, ms) / 60000;
  let value = 100;
  let t = null;
  let zeroAt = null;
  for (const m of matches) {
    if (m.start >= until) break;
    const segments = activeSegments(m.start, Math.min(m.end, until), m.pauses);
    for (const [start, end] of segments) {
      if (t !== null) value = Math.min(100, value + minutes(start - t) * STAMINA_RECOVER);
      const drain = minutes(end - start) * STAMINA_DRAIN;
      if (zeroAt === null && value - drain <= 0) zeroAt = start + (value / STAMINA_DRAIN) * 60000;
      value = Math.max(0, value - drain);
      t = end;
    }
    if (t === null) t = m.start;   // 開打即暫停的極端情況
    // 輸球：比賽結束當下再扣（比賽還沒結束則不扣）
    if (m.lost && m.end <= until) {
      value = Math.min(100, value + minutes(m.end - t) * STAMINA_RECOVER);   // 最後一段暫停視同休息
      t = m.end;
      if (zeroAt === null && value - STAMINA_LOSS_PENALTY <= 0) zeroAt = m.end;
      value = Math.max(0, value - STAMINA_LOSS_PENALTY);
    }
  }
  if (t !== null && t < until) value = Math.min(100, value + minutes(until - t) * STAMINA_RECOVER);
  return { value: Math.round(value), zeroAt };
}

function staminaOf(player, now = Date.now()) {
  return staminaTrack(player, now).value;
}

function renderStamina(player) {
  const v = staminaOf(player);
  const level = v >= 60 ? 'high' : (v >= 30 ? 'mid' : 'low');
  return `<div class="stamina" aria-label="體力 ${v}">
    <div class="stamina-track"><div class="stamina-fill ${level}" style="width:${v}%"></div></div>

  </div>`;
}
